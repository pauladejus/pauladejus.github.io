<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0E0E10" />
<title>EMOJIPLAY — emoji drawing tool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
:root{
  --bg:#0E0E10;
  --panel:#17171A;
  --panel-2:#1E1E23;
  --line:#2C2C34;
  --violet:#5900FF;
  --violet-soft:#7B33FF;
  --text:#FFFFFF;
  --muted:#9A9AA6;
  --radius:10px;
  --strip:56px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg);
  color:var(--text);
  font:500 13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
}

/* ---------- shell ---------- */
#app{
  height:100%;
  display:grid;
  grid-template-columns:236px 1fr 244px;
  grid-template-rows:auto 1fr;
  grid-template-areas:"head head head" "left stage right";
}

#head{
  grid-area:head;
  display:flex;
  align-items:baseline;
  gap:14px;
  padding:14px 18px 12px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
}
.wordmark{
  font:800 24px/1 ui-sans-serif,system-ui,sans-serif;
  letter-spacing:.14em;
  background:linear-gradient(90deg,#FF2E93,#FF7A00,#FFE600,#00FF85,#00E5FF,#B14BFF,#FF2E93);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:hue 9s linear infinite;
}
@keyframes hue{to{background-position:300% 0;}}
.tagline{color:var(--muted);font-size:12px;letter-spacing:.04em;}
.byline{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}

/* ---------- panels ---------- */
aside{
  background:var(--panel);
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
}
#left{grid-area:left;border-right:1px solid var(--line);}
#right{grid-area:right;border-left:1px solid var(--line);}

.sect{padding:14px 16px;border-bottom:1px solid var(--line);}
.sect h2{
  margin:0 0 11px;
  font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.2em;
  text-transform:uppercase;
}
.sect[data-tint="1"] h2{color:#FF2E93;}
.sect[data-tint="2"] h2{color:#00E5FF;}
.sect[data-tint="3"] h2{color:#FFE600;}
.sect[data-tint="4"] h2{color:#00FF85;}
.sect[data-tint="5"] h2{color:#FF7A00;}
.sect[data-tint="6"] h2{color:#B14BFF;}

.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.row:last-child{margin-bottom:0;}
.row label{color:var(--muted);font-size:11px;letter-spacing:.05em;flex:0 0 62px;}
.val{
  margin-left:auto;font:600 11px/1 ui-monospace,Menlo,monospace;
  color:var(--text);min-width:34px;text-align:right;
}

/* ---------- controls ---------- */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  flex:1;height:3px;border-radius:2px;background:var(--line);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--violet);border:2px solid #fff;cursor:pointer;
}
input[type=range]::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;
  background:var(--violet);border:2px solid #fff;cursor:pointer;border-color:#fff;
}
input[type=color]{
  -webkit-appearance:none;appearance:none;border:none;background:none;
  width:38px;height:26px;padding:0;border-radius:6px;cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:6px;}
input[type=color]::-moz-color-swatch{border:1px solid var(--line);border-radius:6px;}

select{
  flex:1;background:var(--panel-2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font:500 12px/1 inherit;cursor:pointer;
}

button{
  font:600 12px/1 inherit;color:var(--text);
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:9px 10px;cursor:pointer;
  transition:border-color .12s,background .12s,transform .06s;
}
button:hover{border-color:var(--violet-soft);}
button:active{transform:translateY(1px);}
button[aria-pressed="true"]{
  background:var(--violet);border-color:var(--violet);
}
button:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid #00E5FF;outline-offset:2px;
}

.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.stack{display:grid;gap:7px;}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.danger:hover{border-color:#FF4D4D;}

/* ---------- swatches ---------- */
.swatches{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;}
.sw{
  aspect-ratio:1;border-radius:5px;border:1px solid rgba(255,255,255,.14);
  cursor:pointer;padding:0;
}
.sw[aria-pressed="true"]{outline:2px solid #fff;outline-offset:1px;background-clip:padding-box;}

/* ---------- emoji palette ---------- */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.em{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:19px;line-height:1;background:transparent;border:1px solid transparent;
  border-radius:7px;cursor:pointer;padding:0;
}
.em:hover{background:var(--panel-2);border-color:var(--line);}
.em[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);}
#current{
  display:flex;align-items:center;gap:10px;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;
}
#current .big{font-size:28px;line-height:1;}
#current .lbl{color:var(--muted);font-size:11px;}

#chips{
  position:sticky;top:0;z-index:5;
  display:flex;flex-wrap:wrap;gap:5px;
  padding:10px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}
#chips button{
  padding:5px 9px;border-radius:20px;
  font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
#chips button:hover{color:var(--text);border-color:var(--violet-soft);}
#fontnote{
  width:100%;color:var(--muted);
  font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.04em;padding-top:2px;
}
#recent:empty::after{
  content:"emoji you use appear here";
  color:var(--muted);font-size:11px;grid-column:1/-1;
}

/* ---------- stage ---------- */
#stage{
  grid-area:stage;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  padding:22px;min-width:0;min-height:0;
  background:
    radial-gradient(120% 90% at 50% 0%,#141419 0%,var(--bg) 60%);
}
#frame{
  position:relative;
  max-width:100%;max-height:100%;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(89,0,255,.18),0 20px 60px rgba(0,0,0,.55);
  background-color:#232329;
  background-image:
    linear-gradient(45deg,#1a1a1f 25%,transparent 25%,transparent 75%,#1a1a1f 75%),
    linear-gradient(45deg,#1a1a1f 25%,transparent 25%,transparent 75%,#1a1a1f 75%);
  background-size:18px 18px;
  background-position:0 0,9px 9px;
}
/* p5 writes inline width/height on the canvas — !important is required to override it */
#frame canvas{
  display:block;
  width:100% !important;height:100% !important;
  touch-action:none;cursor:crosshair;
}

/* ---------- mobile chrome (hidden on desktop) ---------- */
#strip,#sheetbg,#bar{display:none;}

@media (max-width:900px){
  #app{
    grid-template-columns:1fr;
    grid-template-rows:auto auto 1fr auto;
    grid-template-areas:"head" "strip" "stage" "bar";
  }
  #head{padding:10px 14px 9px;}
  .wordmark{font-size:19px;}
  .tagline,.byline{display:none;}

  #strip{
    grid-area:strip;display:flex;gap:7px;
    padding:8px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);overflow-x:auto;
  }
  #strip button{flex:1 0 auto;padding:9px 13px;white-space:nowrap;}

  #stage{padding:12px;}

  #bar{
    grid-area:bar;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--panel);
  }
  #bar button{padding:12px 8px;}
  #bar .export{background:var(--violet);border-color:var(--violet);}

  aside{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    max-height:66vh;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    transform:translateY(101%);
    transition:transform .22s ease;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
  }
  aside.open{transform:translateY(0);}
  #left,#right{border-left:none;border-right:none;}
  aside::before{
    content:"";display:block;width:38px;height:4px;border-radius:2px;
    background:var(--line);margin:9px auto 3px;
  }
  #sheetbg{
    display:block;position:fixed;inset:0;z-index:20;
    background:rgba(0,0,0,.55);opacity:0;pointer-events:none;
    transition:opacity .22s ease;
  }
  #sheetbg.on{opacity:1;pointer-events:auto;}
  .grid{grid-template-columns:repeat(8,1fr);}
  .em{font-size:22px;}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}

/* ---------- additions: tools, options, layers, search ---------- */
.headact{display:flex;gap:6px;margin-left:16px;align-self:center;}
.headact button{padding:8px 12px;}
.primary,.headact .primary{background:var(--violet);border-color:var(--violet);}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.tools button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;font-size:10.5px;}
.tools button span{font-size:19px;line-height:1;}
[data-for][hidden]{display:none !important;}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.seg3 button{padding:9px 4px;font-size:11px;}
.quad{display:grid;grid-template-columns:1.3fr 1.3fr .7fr .7fr;gap:5px;}
.quad button{padding:9px 4px;white-space:nowrap;}
.hint{color:var(--muted);font-size:11px;line-height:1.4;margin-top:9px;}
.hint:empty{display:none;}
.colorblk{margin-top:4px;}
button:disabled{opacity:.4;cursor:default;}
button:disabled:hover{border-color:var(--line);}
details.more{margin-top:4px;}
details.more summary{color:var(--muted);font-size:11px;cursor:pointer;padding:4px 0 10px;}
details.fold > summary{list-style:none;cursor:pointer;}
details.fold > summary::-webkit-details-marker{display:none;}
details.fold > summary h2{display:flex;align-items:center;gap:8px;margin:0;}
details.fold > summary h2::after{content:"▸";margin-left:auto;color:var(--muted);font-size:12px;transition:transform .15s;}
details.fold[open] > summary h2::after{transform:rotate(90deg);}
details.fold[open] > summary{margin-bottom:11px;}
.badge{font:700 9px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#fff;background:var(--violet);border-radius:9px;padding:3px 6px;}
.badge:empty{display:none;}
.layers{display:grid;gap:4px;margin-bottom:8px;}
.lrow{display:flex;gap:4px;}
.lrow .eye{flex:0 0 34px;padding:7px 0;font-size:13px;}
.lrow .eye[aria-pressed="true"]{background:var(--panel-2);border-color:var(--line);}
.lrow .eye[aria-pressed="false"]{opacity:.5;}
.lrow .lname{flex:1;text-align:left;padding:8px 10px;}
.search{margin:10px 0 7px;}
.search input{
  width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;font:500 13px/1 inherit;outline:none;
}
.search input:focus{border-color:var(--violet-soft);}
.sortrow{margin:0;}
#results,#colorPalette{padding:12px 16px;}
#results .none{color:var(--muted);font-size:12px;}
#tools2{display:none;}
@media (max-width:900px){
  .headact,#toolSect{display:none;}
  #strip{gap:5px !important;padding:8px 10px !important;}
  #tools2{display:flex;gap:4px;flex:1 1 auto;}
  #tools2 button{flex:1 1 0;min-width:0;padding:7px 0;font-size:17px;line-height:1;}
  #strip .sheetbtn{flex:0 0 auto;padding:8px 9px;font-size:12px;}
  #bar{grid-template-columns:1fr 1fr 1.3fr !important;}
}
</style>
</head>
<body>

<div id="app">
  <header id="head">
    <span class="wordmark">EMOJIPLAY</span>
    <span class="tagline">emoji drawing tool</span>
    <span class="byline" id="byline">made by Paula Dejus</span>
    <div class="headact">
      <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
      <button id="export" class="primary">Export</button>
    </div>
  </header>

  <nav id="strip">
    <div class="tools mini" id="tools2"></div>
    <button data-sheet="left" class="sheetbtn">⚙︎ Options</button>
    <button data-sheet="right" class="sheetbtn">😀 Emoji</button>
  </nav>

  <aside id="left">
    <div class="sect" data-tint="1" id="toolSect">
      <h2>Tool</h2>
      <div class="tools" id="tools">
        <button data-mode="draw" aria-pressed="true"><span>✏️</span>Draw</button>
        <button data-mode="emoji" aria-pressed="false"><span>😀</span>Emoji</button>
        <button data-mode="shape" aria-pressed="false"><span>🔷</span>Shape</button>
        <button data-mode="fill" aria-pressed="false"><span>🪣</span>Fill</button>
        <button data-mode="erase" aria-pressed="false"><span>🧽</span>Erase</button>
      </div>
    </div>

    <!-- options: each block shows only for the tools listed in data-for -->
    <div class="sect" data-tint="2" id="opts">
      <h2 id="optsTitle">Draw options</h2>

      <div data-for="shape">
        <div class="seg3">
          <button data-shape="rect" aria-pressed="true" title="Rectangle">▭ Rect</button>
          <button data-shape="ellipse" aria-pressed="false" title="Ellipse">◯ Oval</button>
          <button data-shape="triangle" aria-pressed="false" title="Triangle">△ Tri</button>
          <button data-shape="line" aria-pressed="false" title="Line">╱ Line</button>
          <button data-shape="star" aria-pressed="false" title="Star">☆ Star</button>
          <button data-shape="heart" aria-pressed="false" title="Heart">♡ Heart</button>
        </div>
        <div class="pair" style="margin:7px 0 11px">
          <button id="shapeOutline" aria-pressed="true">Outline</button>
          <button id="shapeFill" aria-pressed="false">Filled</button>
        </div>
      </div>

      <div data-for="draw shape erase" class="row">
        <label for="thick">Size</label>
        <input type="range" id="thick" min="1" max="80" value="6" />
        <span class="val" id="thickVal">6</span>
      </div>

      <div data-for="emoji">
        <div class="row">
          <label for="emSize">Size</label>
          <input type="range" id="emSize" min="10" max="400" value="80" />
          <span class="val" id="emSizeVal">80</span>
        </div>
        <div class="row">
          <label for="spacing">Spacing</label>
          <input type="range" id="spacing" min="10" max="300" value="80" />
          <span class="val" id="spacingVal">80</span>
        </div>
        <details class="more">
          <summary>More emoji options</summary>
          <div class="row">
            <label for="scatter">Scatter</label>
            <input type="range" id="scatter" min="0" max="200" value="0" />
            <span class="val" id="scatterVal">0</span>
          </div>
          <div class="row">
            <label for="sizeJit">Size mix</label>
            <input type="range" id="sizeJit" min="0" max="90" value="0" />
            <span class="val" id="sizeJitVal">0</span>
          </div>
          <div class="row">
            <label for="turnJit">Wobble</label>
            <input type="range" id="turnJit" min="0" max="180" value="0" />
            <span class="val" id="turnJitVal">0</span>
          </div>
          <div class="pair" style="margin-bottom:7px">
            <button id="spin" aria-pressed="false">Spin</button>
            <button id="follow" aria-pressed="false">Follow line</button>
            <button data-flip="x" aria-pressed="false">Flip ↔</button>
            <button data-flip="y" aria-pressed="false">Flip ↕</button>
          </div>
          <div class="stack"><button id="mix" aria-pressed="false">Mix recent emoji</button></div>
        </details>
      </div>

      <div data-for="fill" class="row">
        <label for="tol">Tolerance</label>
        <input type="range" id="tol" min="0" max="180" value="40" />
        <span class="val" id="tolVal">40</span>
      </div>

      <div data-for="draw shape fill" class="colorblk">
        <div class="row">
          <label for="brushColor">Color</label>
          <input type="color" id="brushColor" value="#5900FF" />
          <span class="val" id="brushHex">5900FF</span>
        </div>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="hint" id="toolHint"></div>
    </div>

    <details class="sect fold" data-tint="6" id="symFold">
      <summary><h2>Symmetry <span class="badge" id="symBadge"></span></h2></summary>
      <div class="pair">
        <button data-mirror="x" aria-pressed="false">Mirror ↔</button>
        <button data-mirror="y" aria-pressed="false">Mirror ↕</button>
      </div>
      <div class="row" style="margin-top:10px">
        <label for="radial">Radial</label>
        <select id="radial">
          <option value="1">Off</option>
          <option value="3">3 rays</option>
          <option value="4">4 rays</option>
          <option value="5">5 rays</option>
          <option value="6">6 rays</option>
          <option value="8">8 rays</option>
          <option value="12">12 rays</option>
          <option value="16">16 rays</option>
        </select>
      </div>
      <div class="hint">Radial + Mirror ↔ = kaleidoscope.</div>
    </details>

    <details class="sect fold" data-tint="4" open>
      <summary><h2>Layers</h2></summary>
      <div class="layers" id="layers"></div>
      <div class="quad">
        <button id="addLayer" title="New layer">+ New</button>
        <button id="delLayer" class="danger" title="Delete layer">Delete</button>
        <button id="upLayer" title="Move layer up">↑</button>
        <button id="downLayer" title="Move layer down">↓</button>
      </div>
      <div class="stack" style="margin-top:7px">
        <button id="clear" class="danger">Clear this layer</button>
      </div>
    </details>

    <details class="sect fold" data-tint="5">
      <summary><h2>Canvas &amp; export</h2></summary>
      <div class="row">
        <label for="shape">Size</label>
        <select id="shape">
          <option value="1024x1024">Square 1024</option>
          <option value="512x512">Square 512</option>
          <option value="2048x2048">Square 2048</option>
          <option value="1920x1080">Wide 1920×1080</option>
          <option value="1080x1920">Tall 1080×1920</option>
        </select>
      </div>
      <div class="row">
        <label for="bgColor">Paper</label>
        <input type="color" id="bgColor" value="#0E0E10" />
        <button id="applyBg" style="flex:1">Fill paper</button>
      </div>
      <div class="stack">
        <button id="transparent" aria-pressed="true">Transparent paper</button>
      </div>
      <div class="row" style="margin-top:12px">
        <label>Export</label>
        <select id="exportFmt" aria-label="Export format">
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
        </select>
        <select id="exportScale" aria-label="Export size">
          <option value="1">1×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div class="stack">
        <button id="surprise">Surprise me ✨</button>
        <button id="newDrawing" class="danger">New drawing</button>
      </div>
      <div class="hint" id="saved">Autosave on: your drawing stays after reload.</div>
    </details>
  </aside>

  <main id="stage"><div id="frame"></div></main>

  <aside id="right">
    <div class="sect" data-tint="1">
      <div id="current"><span class="big">☀️</span><span class="lbl">tap any emoji below</span></div>
      <div class="search">
        <input type="search" id="search" placeholder="Search emoji… (cat, kaķis, heart)" autocomplete="off" />
      </div>
      <div class="row sortrow">
        <label for="sort">Order</label>
        <select id="sort">
          <option value="theme">By theme</option>
          <option value="color">By color 🌈</option>
          <option value="name">By name A–Z</option>
          <option value="new">Newest first</option>
        </select>
      </div>
      <h2 style="margin:13px 0 8px">Recent</h2>
      <div class="grid" id="recent"></div>
    </div>
    <div id="chips"></div>
    <div id="results" hidden></div>
    <div id="palette"></div>
  </aside>

  <nav id="bar">
    <button id="undo2">↶ Undo</button>
    <button id="redo2">↷ Redo</button>
    <button id="export2" class="export">Export</button>
  </nav>
</div>
<div id="sheetbg"></div>

<script>
/* ============================================================
   EMOJIPLAY — emoji drawing tool
   Descended from the original p5 emoji sketch; rebuilt as a
   single-file tool in the PIXELPLAY shell.
   Layers, redo, symmetry, emoji brush, shapes, autosave.

const $ = s => document.querySelector(s);
const frame = $('#frame');

/* ---------------- p5 ---------------- */
function setup(){
  const c = createCanvas(state.W, state.H);
  c.parent(frame);
  canvasElt = c.elt;
  pixelDensity(1);
  buildLayers();
  attachPointer($('#stage'));   // the whole stage, so a shape can start or end past the canvas edge
  sizeFrame();
  loadSaved();
}

function makeGraphics(){
  const g = createGraphics(state.W, state.H);
  g.clear();
  g.textAlign(CENTER, CENTER);
  g.strokeCap(ROUND);
  g.strokeJoin(ROUND);
  return g;
}

function makeLayer(name){
  return {name: name || ('Layer ' + (++layerCount)), g: makeGraphics(), visible: true};
}

function buildLayers(){
  if (bgLayer) bgLayer.remove();
  layers.forEach(l => l.g.remove());
  bgLayer = createGraphics(state.W, state.H);
  bgLayer.clear();
  if (!state.transparent) bgLayer.background(state.paper);
  layerCount = 0;
  layers = [makeLayer('Background'), makeLayer()];
  activeIdx = 1;
  history = []; redoStack = [];
  renderLayers();
}

function draw(){
  clear();
  image(bgLayer, 0, 0);
  layers.forEach(l => { if (l.visible) image(l.g, 0, 0); });
  drawGuides();
  drawPreview();
}

/* -------------- symmetry -------------- */
/* Every mark is drawn once per transform: optional mirror, then a rotation
   about the canvas centre. Radial + Mirror X gives a kaleidoscope. */
function symXforms(){
  const base = [{fx:1, fy:1}];
  if (state.mirrorX) base.push({fx:-1, fy:1});
  if (state.mirrorY) base.push({fx:1, fy:-1});
  // with rotation on, the X+Y copy is just a half turn — skip the duplicate
  if (state.mirrorX && state.mirrorY && state.radial % 2) base.push({fx:-1, fy:-1});
  else if (state.mirrorX && state.mirrorY && state.radial === 1) base.push({fx:-1, fy:-1});
  const n = Math.max(1, state.radial), out = [];
  for (let k = 0; k < n; k++) base.forEach(b => out.push({fx:b.fx, fy:b.fy, a: k * TWO_PI / n}));
  return out;
}
function applyX(t, x, y){
  const cx = state.W / 2, cy = state.H / 2;
  const dx = (x - cx) * t.fx, dy = (y - cy) * t.fy;
  const c = Math.cos(t.a), s = Math.sin(t.a);
  return {x: cx + dx * c - dy * s, y: cy + dx * s + dy * c};
}
function mirrored(x, y){ return symXforms().map(t => applyX(t, x, y)); }

/* faint axes on screen only, never exported */
function drawGuides(){
  if (state.radial <= 1 && !state.mirrorX && !state.mirrorY) return;
  const W = state.W, H = state.H, cx = W / 2, cy = H / 2, R = Math.hypot(W, H);
  push();
  drawingContext.globalAlpha = 0.22;
  stroke(255);
  strokeWeight(Math.max(1, W / 900));
  drawingContext.setLineDash([W / 90, W / 90]);
  if (state.radial > 1){
    for (let k = 0; k < state.radial; k++){
      const a = -HALF_PI + k * TWO_PI / state.radial;
      line(cx, cy, cx + R * Math.cos(a), cy + R * Math.sin(a));
    }
  }
  if (state.mirrorX) line(cx, 0, cx, H);
  if (state.mirrorY) line(0, cy, W, cy);
  drawingContext.setLineDash([]);
  pop();
}

/* Ghost of the mark you are about to make. Drawn on the visible canvas only. */
function drawPreview(){
  if (shapeDrag){
    push();
    drawingContext.globalAlpha = 0.65;
    paintShape(p5.instance, shapePoints(shapeDrag.a, shapeDrag.b, shapeDrag.shift));
    pop();
    return;
  }
  if (!hover) return;

  if (state.mode === 'emoji'){
    push();
    drawingContext.globalAlpha = 0.5;
    noStroke();
    fill(state.color);
    textAlign(CENTER, CENTER);
    textSize(state.emojiSize);
    translate(hover.x, hover.y);
    scale(state.flipX ? -1 : 1, state.flipY ? -1 : 1);
    text(state.emoji, 0, 0);
    pop();

  } else if (state.mode === 'draw' || state.mode === 'erase' || state.mode === 'shape'){
    push();
    drawingContext.globalAlpha = 0.7;
    noFill();
    stroke(255);
    strokeWeight(Math.max(1, state.W / 800));
    circle(hover.x, hover.y, Math.max(3, state.thickness));
    pop();
  }
}

/* -------------- sizing -------------- */
function sizeFrame(){
  const stage = $('#stage');
  const pad = 2;
  const availW = stage.clientWidth  - parseFloat(getComputedStyle(stage).paddingLeft) * 2 - pad;
  const availH = stage.clientHeight - parseFloat(getComputedStyle(stage).paddingTop)  * 2 - pad;
  const scale = Math.min(availW / state.W, availH / state.H);
  frame.style.width  = Math.max(80, Math.floor(state.W * scale)) + 'px';
  frame.style.height = Math.max(80, Math.floor(state.H * scale)) + 'px';
}
window.addEventListener('resize', () => sizeFrame());

/* -------------- pointer -------------- */
function toCanvas(e){
  // measure the canvas itself, not the frame — the frame's border would skew the mapping
  const r = canvasElt.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (state.W / r.width),
    y: (e.clientY - r.top)  * (state.H / r.height)
  };
}

const active = new Map();   // every pointer currently on the canvas
let pinch = null;           // two-finger sizing gesture

function pinchSpan(){
  const p = [...active.values()];
  return dist(p[0].x, p[0].y, p[1].x, p[1].y);
}
function pinchMid(){
  const p = [...active.values()];
  return {x:(p[0].x + p[1].x) / 2, y:(p[0].y + p[1].y) / 2};
}

const usesEmojiSize = () => state.mode === 'emoji';

function startPinch(){
  // a pinch is not a drawing gesture — roll back the mark the first finger made
  if (pointerDown){
    if (shapeDrag) shapeDrag = null; else rollback();
    pointerDown = false; prev = null; lastStamp = null;
  }
  pinch = {span: pinchSpan(), size: usesEmojiSize() ? state.emojiSize : state.thickness};
  hover = pinchMid();
}

function updatePinch(){
  const k = pinchSpan() / Math.max(1, pinch.span);
  if (usesEmojiSize())             setSize('emojiSize', 'emSize', 'emSizeVal', pinch.size * k);
  else if (state.mode !== 'fill')  setSize('thickness', 'thick', 'thickVal', pinch.size * k);
  hover = pinchMid();
}

function attachPointer(el){
  el.addEventListener('pointerdown', e => {
    const p = toCanvas(e);
    active.set(e.pointerId, p);

    if (active.size === 2){ startPinch(); e.preventDefault(); return; }
    if (active.size > 1)  { e.preventDefault(); return; }   // ignore extra fingers / palm

    el.setPointerCapture(e.pointerId);
    // drawing on a hidden layer would look like nothing happened
    if (!cur().visible){ cur().visible = true; renderLayers(); }
    pointerDown = true;
    prev = p;
    hover = p;
    lastStamp = null;

    if (state.mode === 'shape'){
      shapeDrag = {a: p, b: p, shift: e.shiftKey};
    } else {
      pushHistory();
      if (state.mode === 'emoji'){ brushCarry = 0; brushEmoji(p, 0); }
      else if (state.mode === 'fill') fillAt(p);
      else strokeSeg(p, p);
    }
    e.preventDefault();
  });

  el.addEventListener('pointermove', e => {
    const p = toCanvas(e);
    if (active.has(e.pointerId)) active.set(e.pointerId, p);

    if (pinch && active.size >= 2){ updatePinch(); e.preventDefault(); return; }

    hover = p;
    if (!pointerDown || state.mode === 'fill') return;
    if (state.mode === 'shape'){
      if (shapeDrag){ shapeDrag.b = p; shapeDrag.shift = e.shiftKey; }
    } else if (state.mode === 'emoji'){
      brushTo(prev, p);
    } else {
      strokeSeg(prev, p);
    }
    prev = p;
    e.preventDefault();
  });

  const end = e => {
    if (e) active.delete(e.pointerId);
    if (pinch && active.size < 2){ pinch = null; hover = null; }
    if (shapeDrag && pointerDown && e && e.type === 'pointerup') commitShape();
    shapeDrag = null;
    if (pointerDown) scheduleSave();
    pointerDown = false; prev = null; lastStamp = null;
    // touch has no hover state — leaving the ghost behind would strand it on canvas
    if (e && e.pointerType !== 'mouse') hover = null;
    if (e) e.preventDefault();
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', () => { if (!active.size) hover = null; });
  el.addEventListener('contextmenu', e => e.preventDefault());

  // Wheel resizes the active tool. Multiplicative so it feels even across the range.
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    const factor = Math.pow(1.12, dir);
    const grow = v => (Math.abs(v * factor - v) < 1 ? v + dir : v * factor);
    if (usesEmojiSize()){
      setSize('emojiSize', 'emSize', 'emSizeVal', grow(state.emojiSize));
    } else if (state.mode === 'fill'){
      setSize('tolerance', 'tol', 'tolVal', state.tolerance + dir * 4);
    } else {
      setSize('thickness', 'thick', 'thickVal', grow(state.thickness));
    }
  }, {passive:false});
}

function setSize(key, sliderId, valId, value){
  const el = document.getElementById(sliderId);
  const v = Math.round(Math.min(+el.max, Math.max(+el.min, value)));
  state[key] = v;
  el.value = v;
  document.getElementById(valId).textContent = v;
}

/* -------------- marks -------------- */
function strokeSeg(a, b){
  const g = cur().g;
  const erasing = state.mode === 'erase';
  if (erasing) g.erase();
  g.noFill();
  g.stroke(erasing ? 255 : state.color);
  g.strokeWeight(state.thickness);
  const A = mirrored(a.x, a.y), B = mirrored(b.x, b.y);
  for (let i = 0; i < A.length; i++) g.line(A[i].x, A[i].y, B[i].x, B[i].y);
  if (erasing) g.noErase();
  g.fill(255); // restore fill so later text()/shape calls aren't silently dropped
}

/* One emoji, repeated through every symmetry transform. Mirrored copies are
   flipped and rotated copies turn with their ray, so the pattern stays true. */
function drawEmoji(g, em, p, size, rot, flipX, flipY){
  g.fill(state.color);
  g.noStroke();
  g.textAlign(CENTER, CENTER);
  g.textSize(Math.max(4, size));
  symXforms().forEach(t => {
    const q = applyX(t, p.x, p.y);
    g.push();
    g.translate(q.x, q.y);
    if (t.a) g.rotate(t.a);
    if (t.fx < 0 || t.fy < 0) g.scale(t.fx, t.fy);
    if (rot) g.rotate(rot);
    if (flipX || flipY) g.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    g.text(em, 0, 0);
    g.pop();
  });
}

function jitter(p){
  if (!state.scatter) return p;
  return {x: p.x + random(-state.scatter, state.scatter), y: p.y + random(-state.scatter, state.scatter)};
}

/* Emoji brush: emoji laid along the path at an even spacing, each a little different. */
function brushEmoji(p, dirAngle){
  const em = (state.mix && recentList.length > 1) ? random(recentList) : state.emoji;
  const j = state.sizeJit / 100;
  const size = state.emojiSize * (1 + random(-j, j));
  let rot = radians(random(-state.turnJit, state.turnJit));
  if (state.follow) rot += dirAngle;
  if (state.spin) rot += random(TWO_PI);
  drawEmoji(cur().g, em, jitter(p), size, rot, state.flipX, state.flipY);
}

function brushTo(a, b){
  const gap = Math.max(3, state.emojiSize * state.spacing / 100);
  const d = dist(a.x, a.y, b.x, b.y);
  if (d === 0) return;
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  let pos = gap - brushCarry, last = null;
  while (pos <= d){
    const t = pos / d;
    brushEmoji({x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t}, ang);
    last = pos;
    pos += gap;
  }
  brushCarry = last === null ? brushCarry + d : d - last;
}

/* -------------- shapes -------------- */
/* Every shape becomes a list of points, so symmetry can transform it like any mark. */
function shapePoints(a, b, even){
  let x0 = a.x, y0 = a.y, x1 = b.x, y1 = b.y;
  const type = state.shape;
  if (even){
    const dx = x1 - x0, dy = y1 - y0;
    if (type === 'line'){
      const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
      const len = Math.hypot(dx, dy);
      x1 = x0 + Math.cos(ang) * len; y1 = y0 + Math.sin(ang) * len;
    } else {
      const s = Math.max(Math.abs(dx), Math.abs(dy));
      x1 = x0 + (dx < 0 ? -s : s); y1 = y0 + (dy < 0 ? -s : s);
    }
  }
  // Near the canvas edge (or past it) a shape snaps to the edge, so a fill or
  // frame reaches it cleanly — on a phone your finger can't land on the last pixel.
  const W = state.W, H = state.H, near = Math.min(W, H) * 0.03;
  const out = (state.shapeFill && type !== 'line') ? 2 : -state.thickness / 2;
  const sx = v => v < near ? -out : v > W - near ? W + out : v;
  const sy = v => v < near ? -out : v > H - near ? H + out : v;
  x0 = sx(x0); x1 = sx(x1); y0 = sy(y0); y1 = sy(y1);
  if (type === 'line') return {pts: [{x:x0, y:y0}, {x:x1, y:y1}], closed: false};

  const l = Math.min(x0, x1), r = Math.max(x0, x1), t = Math.min(y0, y1), bt = Math.max(y0, y1);
  const cx = (l + r) / 2, cy = (t + bt) / 2, rx = (r - l) / 2, ry = (bt - t) / 2;
  const pts = [];
  if (type === 'rect'){
    pts.push({x:l, y:t}, {x:r, y:t}, {x:r, y:bt}, {x:l, y:bt});
  } else if (type === 'ellipse'){
    const n = 96;
    for (let i = 0; i < n; i++){ const a2 = i / n * TWO_PI; pts.push({x: cx + Math.cos(a2) * rx, y: cy + Math.sin(a2) * ry}); }
  } else if (type === 'triangle'){
    pts.push({x:cx, y:t}, {x:r, y:bt}, {x:l, y:bt});
  } else if (type === 'star'){
    for (let i = 0; i < 10; i++){
      const a2 = -HALF_PI + i * PI / 5, k = i % 2 ? 0.42 : 1;
      pts.push({x: cx + Math.cos(a2) * rx * k, y: cy + Math.sin(a2) * ry * k});
    }
    // the star's points don't reach the bottom of the box — stretch to fit the drag
    const minY = Math.min(...pts.map(p => p.y)), maxY = Math.max(...pts.map(p => p.y));
    pts.forEach(p => { p.y = t + (p.y - minY) / Math.max(1e-6, maxY - minY) * (bt - t); });
  } else if (type === 'heart'){
    const raw = [];
    for (let i = 0; i < 90; i++){
      const s = i / 90 * TWO_PI;
      raw.push({x: 16 * Math.pow(Math.sin(s), 3),
                y: -(13 * Math.cos(s) - 5 * Math.cos(2*s) - 2 * Math.cos(3*s) - Math.cos(4*s))});
    }
    const minY = Math.min(...raw.map(p => p.y)), maxY = Math.max(...raw.map(p => p.y));
    raw.forEach(p => pts.push({x: cx + p.x / 16 * rx, y: t + (p.y - minY) / (maxY - minY) * (bt - t)}));
  }
  return {pts, closed: true};
}

function paintShape(g, shp){
  const filled = state.shapeFill && shp.closed;
  if (filled){ g.fill(state.color); g.noStroke(); }
  else { g.noFill(); g.stroke(state.color); g.strokeWeight(state.thickness); }
  symXforms().forEach(t => {
    g.beginShape();
    shp.pts.forEach(q => { const r = applyX(t, q.x, q.y); g.vertex(r.x, r.y); });
    if (shp.closed) g.endShape(CLOSE); else g.endShape();
  });
  g.noStroke();
  g.fill(255);
}

function commitShape(){
  const {a, b, shift} = shapeDrag;
  if (dist(a.x, a.y, b.x, b.y) < 2) return;
  pushHistory();
  paintShape(cur().g, shapePoints(a, b, shift));
}

/* -------------- paint bucket -------------- */
function hexToRGBA(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16), 255];
}

function fillAt(p){
  const W = state.W, H = state.H;
  const ctx = cur().g.elt.getContext('2d', {willReadFrequently:true});
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const [fr, fg, fb, fa] = hexToRGBA(state.color);
  const tol = state.tolerance;

  const seeds = mirrored(p.x, p.y).map(pt => ({
    x: Math.floor(constrain(pt.x, 0, W - 1)),
    y: Math.floor(constrain(pt.y, 0, H - 1))
  }));

  const s0 = (seeds[0].y * W + seeds[0].x) * 4;
  const tr = d[s0], tg = d[s0+1], tb = d[s0+2], ta = d[s0+3];

  if (Math.abs(tr-fr) < 2 && Math.abs(tg-fg) < 2 && Math.abs(tb-fb) < 2 && Math.abs(ta-fa) < 2) return;

  const match = i => {
    const a = d[i+3];
    if (ta === 0) return a <= tol;
    return Math.abs(d[i]-tr) <= tol && Math.abs(d[i+1]-tg) <= tol &&
           Math.abs(d[i+2]-tb) <= tol && Math.abs(a-ta) <= tol;
  };

  const seen = new Uint8Array(W * H);
  const stack = [];
  seeds.forEach(s => stack.push(s.x, s.y));

  while (stack.length){
    const y = stack.pop(), x = stack.pop();
    if (y < 0 || y >= H) continue;

    let xl = x;
    while (xl >= 0 && !seen[y*W + xl] && match((y*W + xl) * 4)) xl--;
    xl++;
    let xr = x;
    while (xr < W && !seen[y*W + xr] && match((y*W + xr) * 4)) xr++;
    xr--;
    if (xl > xr) continue;

    for (let i = xl; i <= xr; i++){
      const idx = y*W + i, o = idx * 4;
      seen[idx] = 1;
      d[o] = fr; d[o+1] = fg; d[o+2] = fb; d[o+3] = fa;
    }
    for (let i = xl; i <= xr; i++){
      if (y > 0     && !seen[(y-1)*W + i] && match(((y-1)*W + i) * 4)) stack.push(i, y-1);
      if (y < H - 1 && !seen[(y+1)*W + i] && match(((y+1)*W + i) * 4)) stack.push(i, y+1);
    }
  }

  // Soft edges: the anti-aliased rim of a line is half-transparent, so a plain
  // fill leaves a thin see-through halo. Slide the fill colour under that rim.
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const idx = y*W + x;
      if (seen[idx] !== 1) continue;
      const nb = [x > 0 ? idx-1 : -1, x < W-1 ? idx+1 : -1, y > 0 ? idx-W : -1, y < H-1 ? idx+W : -1];
      for (const n of nb){
        if (n < 0 || seen[n]) continue;
        seen[n] = 2;
        const o = n * 4, as = d[o+3] / 255;
        if (as >= 1) continue;
        d[o]   = d[o]   * as + fr * (1 - as);
        d[o+1] = d[o+1] * as + fg * (1 - as);
        d[o+2] = d[o+2] * as + fb * (1 - as);
        d[o+3] = 255;
      }
    }
  }

  ctx.putImageData(img, 0, 0);
}

/* Which emoji render depends on the emoji font installed on this machine, not on
   the file. Draw each one offscreen and compare it to a guaranteed-missing glyph:
   if they match, the font has no coverage and we drop it from the palette. */
const glyphSupported = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 24;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '18px sans-serif';
  const snap = ch => {
    x.clearRect(0, 0, 24, 24);
    x.fillText(ch, 12, 12);
    return x.getImageData(0, 0, 24, 24).data.join(',');
  };
  const tofu  = snap('\uFFFF');   // noncharacter — always the missing-glyph box
  const blank = snap(' ');
  return ch => { const s = snap(ch); return s !== tofu && s !== blank; };
})();

/* -------------- history -------------- */
/* Each entry is the operation that reverts a change. Applying one returns the
   operation that re-does it, so undo and redo share the same code. */
function snap(g){
  const c = document.createElement('canvas');
  c.width = state.W; c.height = state.H;
  c.getContext('2d').drawImage(g.elt, 0, 0);
  return c;
}
function restore(g, c){
  const ctx = g.drawingContext;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, state.W, state.H);
  ctx.drawImage(c, 0, 0);
  ctx.restore();
}

function pushOp(op){
  history.push(op);
  if (history.length > MAX_HISTORY) history.shift();
  redoStack.length = 0;
  renderLayers();
  scheduleSave();
}
function pushHistory(){ pushOp({type:'px', layer: cur(), img: snap(cur().g)}); }

function applyOp(op){
  switch (op.type){
    case 'px': {
      const now = snap(op.layer.g);
      restore(op.layer.g, op.img);
      const i = layers.indexOf(op.layer);
      if (i > -1) activeIdx = i;
      return {type:'px', layer: op.layer, img: now};
    }
    case 'remove': {
      const i = layers.indexOf(op.layer);
      if (i < 0) return null;
      layers.splice(i, 1);
      activeIdx = Math.min(activeIdx, layers.length - 1);
      return {type:'insert', layer: op.layer, index: i};
    }
    case 'insert': {
      layers.splice(op.index, 0, op.layer);
      activeIdx = op.index;
      return {type:'remove', layer: op.layer};
    }
    case 'move': {
      const i = layers.indexOf(op.layer);
      layers.splice(i, 1);
      layers.splice(op.index, 0, op.layer);
      activeIdx = op.index;
      return {type:'move', layer: op.layer, index: i};
    }
    case 'group': {
      const inv = op.ops.slice().reverse().map(applyOp).filter(Boolean);
      return {type:'group', ops: inv};
    }
  }
  return null;
}

function undo(){
  const op = history.pop();
  if (!op) return;
  const inv = applyOp(op);
  if (inv) redoStack.push(inv);
  renderLayers(); scheduleSave();
}
function redo(){
  const op = redoStack.pop();
  if (!op) return;
  const inv = applyOp(op);
  if (inv) history.push(inv);
  renderLayers(); scheduleSave();
}
/* undo without leaving a redo step — for gestures that turned out not to be marks */
function rollback(){
  const op = history.pop();
  if (op) applyOp(op);
}

/* -------------- layers -------------- */
const layersEl = $('#layers');
function renderLayers(){
  layersEl.textContent = '';
  for (let i = layers.length - 1; i >= 0; i--){
    const l = layers[i];
    const row = document.createElement('div');
    row.className = 'lrow' + (i === activeIdx ? ' on' : '');
    const eye = document.createElement('button');
    eye.className = 'eye';
    eye.textContent = l.visible ? '👁' : '–';
    eye.title = l.visible ? 'Hide layer' : 'Show layer';
    eye.setAttribute('aria-pressed', l.visible ? 'true' : 'false');
    eye.addEventListener('click', () => { l.visible = !l.visible; renderLayers(); scheduleSave(); });
    const nm = document.createElement('button');
    nm.className = 'lname';
    nm.textContent = l.name;
    nm.setAttribute('aria-pressed', i === activeIdx ? 'true' : 'false');
    nm.addEventListener('click', () => { activeIdx = i; renderLayers(); });
    row.append(eye, nm);
    layersEl.appendChild(row);
  }
  $('#delLayer').disabled = layers.length <= 1;
  $('#addLayer').disabled = layers.length >= MAX_LAYERS;
  $('#upLayer').disabled = activeIdx >= layers.length - 1;
  $('#downLayer').disabled = activeIdx <= 0;
}

$('#addLayer').addEventListener('click', () => {
  if (layers.length >= MAX_LAYERS) return;
  const l = makeLayer();
  layers.splice(activeIdx + 1, 0, l);
  activeIdx++;
  pushOp({type:'remove', layer: l});
});
$('#delLayer').addEventListener('click', () => {
  if (layers.length <= 1) return;
  const i = activeIdx, l = layers[i];
  layers.splice(i, 1);
  activeIdx = Math.min(i, layers.length - 1);
  pushOp({type:'insert', layer: l, index: i});
});
function moveLayer(dir){
  const i = activeIdx, j = i + dir;
  if (j < 0 || j >= layers.length) return;
  const l = layers[i];
  layers.splice(i, 1);
  layers.splice(j, 0, l);
  activeIdx = j;
  pushOp({type:'move', layer: l, index: i});
}
$('#upLayer').addEventListener('click', () => moveLayer(1));
$('#downLayer').addEventListener('click', () => moveLayer(-1));

/* -------------- export -------------- */
function exportImage(){
  const k = state.exportScale, jpg = state.exportFmt === 'jpg';
  const W = state.W * k, H = state.H * k;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // JPG has no transparency — transparent paper exports on white
  if (!state.transparent || jpg){
    ctx.fillStyle = state.transparent ? '#FFFFFF' : state.paper;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.drawImage(bgLayer.elt, 0, 0, W, H);
  layers.forEach(l => { if (l.visible) ctx.drawImage(l.g.elt, 0, 0, W, H); });
  out.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'emojiplay_' + Date.now() + (k > 1 ? '@' + k + 'x' : '') + (jpg ? '.jpg' : '.png');
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, jpg ? 'image/jpeg' : 'image/png', 0.92);
}

/* -------------- surprise -------------- */
/* A random little composition on the active layer, from one emoji family.
   Uses the current symmetry, so try it with Radial on. */
let paletteGroups = [];
function surprise(){
  if (!paletteGroups.length) return;
  pushHistory();
  const g = cur().g;
  const fam = random(paletteGroups);
  const pick = [];
  const n = Math.min(fam.length, Math.floor(random(3, 7)));
  while (pick.length < n){ const e = random(fam); if (!pick.includes(e)) pick.push(e); }
  const copies = symXforms().length;
  const count = Math.max(6, Math.floor(random(30, 70) / copies));
  const S = Math.min(state.W, state.H);
  for (let i = 0; i < count; i++){
    const size = S * random(0.03, 0.13) * (random() < 0.12 ? 2.2 : 1);
    const p = {x: random(state.W), y: random(state.H)};
    drawEmoji(g, random(pick), p, size, random(-0.5, 0.5), random() < 0.3, false);
  }
}

/* -------------- autosave (IndexedDB) -------------- */
const DB_NAME = 'emojiplay', DB_STORE = 'autosave';
let saveTimer = null, loading = false;
const savedEl = $('#saved');

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbDo(mode, fn){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, mode);
    const req = fn(tx.objectStore(DB_STORE));
    tx.oncomplete = () => { res(req && req.result); db.close(); };
    tx.onerror = () => { rej(tx.error); db.close(); };
  }));
}

function scheduleSave(){
  if (loading) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (pointerDown){ scheduleSave(); return; }
    saveNow();
  }, 1200);
}

async function saveNow(){
  try {
    const blobs = await Promise.all(layers.map(l => new Promise(r => l.g.elt.toBlob(r, 'image/png'))));
    const settings = {};
    SAVED_KEYS.forEach(k => settings[k] = state[k]);
    const rec = {
      v: 1, W: state.W, H: state.H,
      paper: state.paper, transparent: state.transparent,
      activeIdx, layerCount, recent: recentList.slice(), settings,
      layers: layers.map((l, i) => ({name: l.name, visible: l.visible, blob: blobs[i]}))
    };
    await dbDo('readwrite', st => st.put(rec, 'current'));
    const t = new Date();
    savedEl.textContent = 'Saved in this browser ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
  } catch (err){
    savedEl.textContent = 'Autosave unavailable here — export to keep your work.';
  }
}

async function loadSaved(){
  let rec;
  try { rec = await dbDo('readonly', st => st.get('current')); } catch (err){ return; }
  if (!rec || !rec.layers || !rec.layers.length) return;
  loading = true;
  try {
    if (rec.W !== state.W || rec.H !== state.H){
      state.W = rec.W; state.H = rec.H;
      resizeCanvas(rec.W, rec.H);
      $('#shape').value = rec.W + 'x' + rec.H;
    }
    state.paper = rec.paper; state.transparent = rec.transparent;
    buildLayers();
    layers.forEach(l => l.g.remove());
    layers = [];
    for (const L of rec.layers){
      const l = {name: L.name, g: makeGraphics(), visible: L.visible};
      if (L.blob){
        const bmp = await createImageBitmap(L.blob);
        l.g.drawingContext.drawImage(bmp, 0, 0);
      }
      layers.push(l);
    }
    layerCount = rec.layerCount || layers.length;
    activeIdx = Math.min(rec.activeIdx || 0, layers.length - 1);
    Object.assign(state, rec.settings || {});
    if (rec.recent){ recentList.length = 0; rec.recent.forEach(e => recentList.push(e)); }
    syncUI();
    renderRecent();
    renderLayers();
    sizeFrame();
    savedEl.textContent = 'Restored your last drawing.';
  } catch (err){
    savedEl.textContent = 'Could not restore the last drawing.';
  }
  loading = false;
}

const TOOL_INFO = {

function setMode(m){
  if (m === 'stamp' || m === 'brush') m = 'emoji';   // older saves
  if (!TOOL_INFO[m]) m = 'draw';
  state.mode = m;
  document.querySelectorAll('[data-mode]').forEach(o => press(o, o.dataset.mode === m));
  document.querySelectorAll('#opts [data-for]').forEach(el => { el.hidden = !el.dataset.for.split(' ').includes(m); });
  $('#optsTitle').textContent = TOOL_INFO[m][0];
  $('#toolHint').textContent = TOOL_INFO[m][1];
  const lbl = current.querySelector('.lbl');
  if (lbl) lbl.textContent = m === 'emoji' ? 'tap or drag on the canvas' : 'tap any emoji to use it';
}
document.querySelectorAll('[data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    setMode(b.dataset.mode);
    scheduleSave();
    // on a phone, picking the Emoji tool opens the emoji list right away
    if (b.dataset.mode === 'emoji' && b.closest('#tools2')) openSheet('right');
  });
});

document.querySelectorAll('[data-shape]').forEach(b => {
  b.addEventListener('click', () => {
    state.shape = b.dataset.shape;
    document.querySelectorAll('[data-shape]').forEach(o => press(o, o === b));
    setMode('shape');
  });
});
function syncShapeFill(){ press($('#shapeFill'), state.shapeFill); press($('#shapeOutline'), !state.shapeFill); }
$('#shapeFill').addEventListener('click', () => { state.shapeFill = true; syncShapeFill(); });
$('#shapeOutline').addEventListener('click', () => { state.shapeFill = false; syncShapeFill(); });

// brush colour
const brushColor = $('#brushColor'), brushHex = $('#brushHex');
function setColor(hex){
  state.color = hex;
  brushColor.value = hex;
  brushHex.textContent = hex.replace('#','').toUpperCase();
  syncSwatches();
}
brushColor.addEventListener('input', () => setColor(brushColor.value));

const swWrap = $('#swatches');
SWATCHES.forEach(hex => {
  const b = document.createElement('button');
  b.className = 'sw';
  b.style.background = hex;
  b.title = hex;
  b.dataset.hex = hex;
  b.addEventListener('click', () => setColor(hex));
  swWrap.appendChild(b);
});
function syncSwatches(){
  swWrap.querySelectorAll('.sw').forEach(b =>
    press(b, b.dataset.hex.toLowerCase() === state.color.toLowerCase()));
}
syncSwatches();

// sliders
const SLIDERS = [['thick','thickVal','thickness'], ['emSize','emSizeVal','emojiSize'],
  ['scatter','scatterVal','scatter'], ['tol','tolVal','tolerance'], ['spacing','spacingVal','spacing'],
  ['sizeJit','sizeJitVal','sizeJit'], ['turnJit','turnJitVal','turnJit']];
SLIDERS.forEach(([id, valId, key]) => {
  const s = $('#' + id), v = $('#' + valId);
  s.addEventListener('input', () => { state[key] = +s.value; v.textContent = s.value; });
});

// toggles
const TOGGLES = [['#spin','spin'], ['#follow','follow'], ['#mix','mix'],
  ['[data-flip="x"]','flipX'], ['[data-flip="y"]','flipY'],
  ['[data-mirror="x"]','mirrorX'], ['[data-mirror="y"]','mirrorY']];
TOGGLES.forEach(([sel, key]) => {
  const b = $(sel);
  b.addEventListener('click', () => { state[key] = !state[key]; press(b, state[key]); syncSym(); });
});

/* the folded Symmetry section says when something is on */
function syncSym(){
  const on = [];
  if (state.mirrorX) on.push('↔');
  if (state.mirrorY) on.push('↕');
  if (state.radial > 1) on.push('✳' + state.radial);
  $('#symBadge').textContent = on.join(' ');
}
$('#radial').addEventListener('change', e => { state.radial = +e.target.value; syncSym(); });
$('#exportFmt').addEventListener('change', e => { state.exportFmt = e.target.value; });
$('#exportScale').addEventListener('change', e => { state.exportScale = +e.target.value; });

/* put every control back in line with state (after a restore) */
function syncUI(){
  SLIDERS.forEach(([id, valId, key]) => { $('#' + id).value = state[key]; $('#' + valId).textContent = state[key]; });
  TOGGLES.forEach(([sel, key]) => press($(sel), !!state[key]));
  $('#radial').value = state.radial;
  $('#exportFmt').value = state.exportFmt;
  $('#exportScale').value = state.exportScale;
  setColor(state.color);
  setMode(state.mode);
  document.querySelectorAll('[data-shape]').forEach(o => press(o, o.dataset.shape === state.shape));
  syncShapeFill();
  syncSym();
  if (state.mirrorX || state.mirrorY || state.radial > 1) $('#symFold').open = true;
  $('#sort').value = state.sort;
  renderSort();
  bgColor.value = state.paper;
  press(transBtn, state.transparent);
  if (state.transparent) bgLayer.clear(); else bgLayer.background(state.paper);
  current.querySelector('.big').textContent = state.emoji;
  palette.querySelectorAll('.em').forEach(o => press(o, o.dataset.em === state.emoji));
}

// paper
const bgColor = $('#bgColor'), transBtn = $('#transparent');
$('#applyBg').addEventListener('click', () => {
  state.paper = bgColor.value;
  state.transparent = false;
  press(transBtn, false);
  bgLayer.background(state.paper);
  scheduleSave();
});
transBtn.addEventListener('click', () => {
  state.transparent = !state.transparent;
  press(transBtn, state.transparent);
  if (state.transparent) bgLayer.clear();
  else bgLayer.background(state.paper);
  scheduleSave();
});

// canvas shape — every layer is rescaled to the new size
$('#shape').addEventListener('change', e => {
  const [w, h] = e.target.value.split('x').map(Number);
  const keep = layers.map(l => ({name: l.name, visible: l.visible, c: snap(l.g)}));
  const keepCount = layerCount, keepActive = activeIdx;
  state.W = w; state.H = h;
  resizeCanvas(w, h);
  buildLayers();
  layers.forEach(l => l.g.remove());
  layers = keep.map(k => {
    const g = makeGraphics();
    g.drawingContext.drawImage(k.c, 0, 0, w, h);
    return {name: k.name, g, visible: k.visible};
  });
  layerCount = keepCount;
  activeIdx = Math.min(keepActive, layers.length - 1);
  renderLayers();
  sizeFrame();
  scheduleSave();
});

// actions
['#undo','#undo2'].forEach(s => $(s).addEventListener('click', undo));
['#redo','#redo2'].forEach(s => $(s).addEventListener('click', redo));
['#clear'].forEach(s => $(s).addEventListener('click', () => { pushHistory(); cur().g.clear(); }));
$('#newDrawing').addEventListener('click', () => {
  // one undo step brings the whole drawing back
  const ops = layers.map(l => ({type:'px', layer: l, img: snap(l.g)}));
  layers.forEach(l => l.g.clear());
  pushOp({type:'group', ops});
});
$('#surprise').addEventListener('click', surprise);
['#export','#export2'].forEach(s => $(s).addEventListener('click', exportImage));

// keyboard
function onKey(e){
  if (!e.key) return;
  if (e._ep) return;                                     // window and document both fire; handle once
  e._ep = true;
  const t = e.target;
  if (t && t.matches && t.matches('input,select,textarea')) return;

  const k = e.key.toLowerCase();

  // Redo — Ctrl+Shift+Z / Ctrl+Y ; Undo — Ctrl+Z
  if ((e.metaKey || e.ctrlKey) && (k === 'y' || (k === 'z' && e.shiftKey))){
    e.preventDefault(); e.stopPropagation(); redo(); return;
  }
  if ((e.metaKey || e.ctrlKey) && k === 'z'){
    e.preventDefault(); e.stopPropagation(); undo(); return;
  }

  if (e.metaKey || e.ctrlKey) return;

  const map = {d:'draw', s:'emoji', b:'emoji', m:'emoji', r:'shape', f:'fill', e:'erase'};
  if (map[k]) setMode(map[k]);
}
window.addEventListener('keydown', onKey, true);
document.addEventListener('keydown', onKey, true);

// emoji palette
const palette = $('#palette'), current = $('#current');
const chips = $('#chips'), recent = $('#recent');
const recentList = [];

function selectEmoji(em){
  state.emoji = em;
  document.querySelectorAll('#right .em').forEach(o => press(o, o.dataset.em === em));
  current.querySelector('.big').textContent = em;
  if (state.mode !== 'emoji') setMode('emoji');
  const at = recentList.indexOf(em);
  if (at > -1) recentList.splice(at, 1);
  recentList.unshift(em);
  if (recentList.length > 12) recentList.pop();
  renderRecent();
  scheduleSave();
  if (window.matchMedia('(max-width:900px)').matches) closeSheets();
}

function emBtn(em){
  const b = document.createElement('button');
  b.className = 'em';
  b.textContent = em;
  b.dataset.em = em;
  b.setAttribute('aria-label', 'Emoji ' + em);
  b.setAttribute('aria-pressed', em === state.emoji ? 'true' : 'false');
  b.addEventListener('click', () => selectEmoji(em));
  return b;
}

function renderRecent(){
  recent.textContent = '';
  recentList.forEach(em => recent.appendChild(emBtn(em)));
}

/* ---- the emoji this machine can draw, by theme ---- */
const glyphOK = new Map();
const canDraw = em => { if (!glyphOK.has(em)) glyphOK.set(em, glyphSupported(em)); return glyphOK.get(em); };

let dropped = 0;
const themeSections = [];
GROUPS.forEach(g => {
  const seenHere = new Set();
  const list = g.list.filter(em => {
    if (seenHere.has(em)) return false;
    seenHere.add(em);
    const ok = canDraw(em);
    if (!ok) dropped++;
    return ok;
  });
  if (!list.length) return;
  paletteGroups.push(list);
  themeSections.push({name: g.name, tint: g.tint, list});
});
const allEmoji = [...new Set(themeSections.flatMap(s => s.list))];

/* ---- colour of an emoji: draw it small, find the strongest hue ---- */
const emColor = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '26px sans-serif';
  const cache = new Map();
  return em => {
    if (cache.has(em)) return cache.get(em);
    x.clearRect(0, 0, 32, 32);
    x.fillText(em, 16, 17);
    const d = x.getImageData(0, 0, 32, 32).data;
    const bins = new Float32Array(24), binL = new Float32Array(24);
    let n = 0, colourful = 0, lsum = 0;
    for (let i = 0; i < d.length; i += 4){
      if (d[i+3] < 120) continue;
      const r = d[i] / 255, g = d[i+1] / 255, b = d[i+2] / 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, ch = mx - mn;
      n++; lsum += l;
      if (ch < 0.2 || l < 0.12 || l > 0.93) continue;
      let h = mx === r ? ((g - b) / ch) % 6 : mx === g ? (b - r) / ch + 2 : (r - g) / ch + 4;
      h = (h * 60 + 360) % 360;
      const k = Math.floor(h / 15);
      bins[k] += ch; binL[k] += l * ch; colourful++;
    }
    let info;
    if (!n || colourful / n < 0.18){
      info = {gray: true, l: n ? lsum / n : 0.5};
    } else {
      let best = 0;
      for (let k = 1; k < 24; k++) if (bins[k] > bins[best]) best = k;
      info = {gray: false, h: best * 15 + 7.5, l: binL[best] / bins[best]};
    }
    cache.set(em, info);
    return info;
  };
})();

const BANDS = [
  ['Red', 1], ['Orange', 5], ['Brown', 5], ['Yellow', 3], ['Green', 4], ['Cyan', 2],
  ['Blue', 2], ['Purple', 6], ['Pink', 1], ['White & gray', 2], ['Black', 6]
];
function bandOf(c){
  if (c.gray) return c.l > 0.62 ? 'White & gray' : c.l < 0.3 ? 'Black' : 'White & gray';
  const h = c.h;
  if (h < 15 || h >= 340) return 'Red';
  if (h < 45) return c.l < 0.42 ? 'Brown' : 'Orange';
  if (h < 70) return 'Yellow';
  if (h < 165) return 'Green';
  if (h < 200) return 'Cyan';
  if (h < 255) return 'Blue';
  if (h < 295) return 'Purple';
  return 'Pink';
}
function colourSections(){
  const by = {};
  allEmoji.forEach(em => { const b = bandOf(emColor(em)); (by[b] = by[b] || []).push(em); });
  const key = em => { const c = emColor(em); return c.gray ? -c.l : ((c.h + 20) % 360) + (1 - c.l) * 10; };
  return BANDS.filter(([name]) => by[name]).map(([name, tint]) =>
    ({name, tint, list: by[name].sort((a, b) => key(a) - key(b))}));
}

/* ---- names, keywords and age come from open emoji data, fetched on demand ---- */
const base = em => em.replace(/️/g, '');
let meta = null, metaLoading = null;
function loadMeta(){
  if (meta) return Promise.resolve(meta);
  if (metaLoading) return metaLoading;
  metaLoading = Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/unicode-emoji-json@0.6.0/data-by-emoji.json').then(r => r.json()),
    fetch('https://cdn.jsdelivr.net/npm/emojilib@3.0.12/dist/emoji-en-US.json').then(r => r.json()).catch(() => ({}))
  ]).then(([info, words]) => {
    const m = new Map();
    Object.entries(info).forEach(([em, v]) => m.set(base(em), {em, name: v.name, ver: parseFloat(v.emoji_version) || 0, words: ''}));
    Object.entries(words).forEach(([em, kw]) => {
      const k = base(em), e = m.get(k) || {em, name: kw[0].replace(/_/g, ' '), ver: 0, words: ''};
      e.words = kw.join(' ').replace(/_/g, ' ').toLowerCase();
      m.set(k, e);
    });
    meta = m;
    return m;
  }).catch(err => { metaLoading = null; throw err; });
  return metaLoading;
}
const metaOf = em => meta && meta.get(base(em));

function nameSections(){
  const sorted = allEmoji.slice().sort((a, b) =>
    ((metaOf(a) || {}).name || '~').localeCompare((metaOf(b) || {}).name || '~'));
  const by = new Map();
  sorted.forEach(em => {
    const n = (metaOf(em) || {}).name || '#';
    const L = /[a-z]/i.test(n[0]) ? n[0].toUpperCase() : '#';
    if (!by.has(L)) by.set(L, []);
    by.get(L).push(em);
  });
  return [...by].map(([name, list], i) => ({name, tint: (i % 6) + 1, list}));
}
function newestSections(){
  const by = new Map();
  allEmoji.forEach(em => {
    const v = (metaOf(em) || {}).ver || 0;
    const k = v >= 6 ? 'Emoji ' + v.toFixed(1) : v >= 1 ? 'Classic (2010–2016)' : 'Other';
    if (!by.has(k)) by.set(k, {v: v >= 6 ? v : v >= 1 ? 1 : 0, list: []});
    by.get(k).list.push(em);
  });
  return [...by].sort((a, b) => b[1].v - a[1].v).map(([name, o], i) => ({name, tint: (i % 6) + 1, list: o.list}));
}

/* ---- draw the palette in the chosen order ---- */
function renderSections(sections){
  palette.textContent = '';
  chips.textContent = '';
  sections.forEach(s => {
    const sect = document.createElement('div');
    sect.className = 'sect';
    sect.dataset.tint = s.tint;
    const h = document.createElement('h2');
    h.textContent = s.name;
    sect.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    s.list.forEach(em => grid.appendChild(emBtn(em)));
    sect.appendChild(grid);
    palette.appendChild(sect);

    const chip = document.createElement('button');
    chip.textContent = s.name;
    chip.addEventListener('click', () => {
      $('#right').scrollTo({top: sect.offsetTop - chips.offsetHeight, behavior:'smooth'});
    });
    chips.appendChild(chip);
  });
  if (dropped){
    const note = document.createElement('span');
    note.id = 'fontnote';
    note.textContent = dropped + ' hidden — no font coverage';
    chips.appendChild(note);
  }
}

function renderSort(){
  const mode = state.sort;
  if (mode === 'color') return renderSections(colourSections());
  if (mode === 'name' || mode === 'new'){
    if (!meta){
      renderSections(themeSections);
      loadMeta().then(() => { if (state.sort === mode) renderSort(); })
                .catch(() => { chips.insertAdjacentHTML('afterbegin', '<span id="fontnote">Could not load emoji names — showing themes.</span>'); });
      return;
    }
    return renderSections(mode === 'name' ? nameSections() : newestSections());
  }
  renderSections(themeSections);
}
$('#sort').addEventListener('change', e => {
  state.sort = e.target.value;
  renderSort();
  $('#right').scrollTo({top: 0});
  scheduleSave();
});

/* ---- search: English names and keywords, a few Latvian words, colours, themes ---- */
const LV = {kakis:'cat', suns:'dog', sirds:'heart', zieds:'flower', puke:'flower', koks:'tree', saule:'sun',
  meness:'moon', zvaigzne:'star', makonis:'cloud', lietus:'rain', sniegs:'snow', uguns:'fire', udens:'water',
  jura:'ocean', zivs:'fish', putns:'bird', maja:'house', masina:'car', auto:'car', ediens:'food', abols:'apple',
  smaids:'smile', seja:'face', roka:'hand', muzika:'music', zals:'green', sarkans:'red', zils:'blue',
  dzeltens:'yellow', melns:'black', balts:'white', roza:'pink', violets:'purple', oranzs:'orange', bruns:'brown',
  zirgs:'horse', pele:'mouse', lacis:'bear', zakis:'rabbit', lapsa:'fox', kukainis:'bug', taurins:'butterfly',
  bite:'bee', sene:'mushroom', davana:'gift', svetki:'party', ziemassvetki:'christmas', bumba:'ball',
  kronis:'crown', dimants:'gem', milestiba:'love', laimigs:'happy', skumjs:'sad', dusmigs:'angry', suns2:'dog',
  ogas:'berry', zemene:'strawberry', kuka:'cake', torte:'cake', kafija:'coffee', te:'tea', varde:'frog',
  cuska:'snake', puce:'owl', pukes:'flower', lapa:'leaf', mezs:'tree', kalns:'mountain', laiva:'boat',
  lidmasina:'airplane', raķete:'rocket', raketе:'rocket', planeta:'planet', zeme:'earth', vejs:'wind',
  varaviksne:'rainbow', spoks:'ghost', robots:'robot', burvis:'mage', pasaka:'fairy', vienradzis:'unicorn',
  purvs:'swamp', akmens:'rock', gliemezis:'snail', vista:'chicken', govs:'cow', cuka:'pig', aita:'sheep'};
const plain = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

const results = $('#results');
let searchTimer = null;
function runSearch(){
  const q = plain($('#search').value);
  if (!q){
    results.hidden = true; palette.hidden = false; chips.hidden = false;
    return;
  }
  results.hidden = false; palette.hidden = true; chips.hidden = true;
  const terms = q.split(/\s+/).map(w => LV[w] || w);
  const scored = new Map();
  const add = (em, s) => { if (canDraw(em)) scored.set(em, Math.max(scored.get(em) || 0, s)); };

  // themes and colours by name
  themeSections.forEach(s => { if (terms.some(t => plain(s.name).startsWith(t))) s.list.forEach(em => add(em, 2)); });
  BANDS.forEach(([name]) => {
    if (terms.some(t => t.length > 2 && plain(name).startsWith(t)))
      allEmoji.forEach(em => { if (bandOf(emColor(em)) === name) add(em, 1); });
  });
  // names and keywords — every term has to match
  if (meta){
    meta.forEach(e => {
      const name = e.name.toLowerCase(), hay = name + ' ' + e.words;
      if (!terms.every(t => hay.includes(t))) return;
      const t0 = terms[0], words = name.split(' ');
      add(e.em, name === t0 ? 8 : name.startsWith(t0 + ' ') ? 7 : words.includes(t0) ? 6 :
                name.includes(t0) ? 5 : 3);
    });
  }
  const list = [...scored].sort((a, b) => b[1] - a[1]).map(([em]) => em).slice(0, 180);

  results.textContent = '';
  if (!meta){
    const p = document.createElement('div');
    p.className = 'hint';
    p.textContent = 'Loading emoji names…';
    results.appendChild(p);
    loadMeta().then(runSearch).catch(() => { p.textContent = 'Could not load emoji names — try a theme or colour (food, red).'; });
  }
  if (!list.length && meta){
    results.innerHTML = '<div class="none">No emoji found. Try another word, a theme (food, animals) or a colour (red, green).</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  list.forEach(em => grid.appendChild(emBtn(em)));
  results.appendChild(grid);
}
$('#search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
$('#search').addEventListener('focus', () => { loadMeta().catch(() => {}); });

renderSort();
if (allEmoji.length){
  state.emoji = allEmoji[0];
  current.querySelector('.big').textContent = state.emoji;
  palette.querySelectorAll('.em').forEach(o => press(o, o.dataset.em === state.emoji));
}

// mobile sheets
const sheetbg = $('#sheetbg');
function closeSheets(){
  document.querySelectorAll('aside').forEach(a => a.classList.remove('open'));
  sheetbg.classList.remove('on');
}
document.querySelectorAll('[data-sheet]').forEach(b => {
  b.addEventListener('click', () => {
    const target = $('#' + b.dataset.sheet);
    const wasOpen = target.classList.contains('open');
    closeSheets();
    if (!wasOpen){ target.classList.add('open'); sheetbg.classList.add('on'); }
  });
});
sheetbg.addEventListener('click', closeSheets);
function openSheet(id){
  closeSheets();
  $('#' + id).classList.add('open');
  sheetbg.classList.add('on');
}

setMode(state.mode);
syncSym();

// the last save is flushed if the tab is closed mid-wait
window.addEventListener('pagehide', () => { if (saveTimer){ clearTimeout(saveTimer); saveNow(); } });
