  :root{
    --bg:#0f1115; --panel:#171a20; --panel2:#20242c; --line:#2b303a;
    --text:#ffffff; --dim:#ffffff; --accent:#5900FF; --accent-ink:#ffffff;
    --danger:#ff7070;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    --sc:#ffffff;
    background:var(--bg); color:var(--text);
    font-family:'Space Mono', monospace; font-size:13px;
    display:flex; flex-direction:column; overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  header{
    --sc:#ffffff;
    display:flex; align-items:center; gap:14px;
    padding:7px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    flex:0 0 auto;
  }
  h1{
    font-family:'Pixelify Sans', monospace; font-size:21px; letter-spacing:2px;
    font-weight:600; color:var(--text);
  }
  .bar-group{display:flex; align-items:center; gap:6px;}
  label.tag{color:var(--dim); font-size:11px; letter-spacing:.5px; text-transform:uppercase; white-space:nowrap;}
  select, button, input[type=range]{font-family:inherit; font-size:13px;}
  select{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    padding:4px 6px; border-radius:5px; outline:none; cursor:pointer;
  }
  .spacer{flex:1;}
  #topbars{display:none;}
  #bbar{display:none;}
  #mbar{
    display:none; align-items:stretch; gap:3px; padding:4px 6px;
    background:var(--panel2); border-bottom:1px solid var(--line);
    overflow-x:auto; -webkit-overflow-scrolling:touch;
  }
  .mbtn{
    flex:0 0 auto; min-width:48px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); color:var(--text); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 4px;
  }
  .mbtn .mi{font-size:16px; line-height:1.1;}
  .mbtn .ml{font-size:9px; color:var(--dim); letter-spacing:.3px;}
  .mbtn.active{border-color:#ffffff; background:var(--line);}
  main{flex:1; display:flex; min-height:0;}
  /* ---------- left panel ---------- */
  #tools{
    flex:0 0 190px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; gap:3px; padding:8px;
    overflow-y:auto;
  }
  #tools h2, #side h2{
    font-family:'Pixelify Sans', monospace; font-size:12px; letter-spacing:2px;
    color:var(--sct,var(--sc)); font-weight:400;
  }
  .group{display:flex; flex-direction:column; gap:4px;
    border-left:3px solid var(--sct,var(--sc)); padding-left:7px; margin-bottom:2px;}
  #side > .sec{border-left:3px solid var(--sct,var(--sc)); padding-left:8px;}
  #tools h2{margin:5px 0 1px;}
  .tgrid{display:grid; grid-template-columns:1fr 1fr; gap:4px;}
  .tbtn{
    border:1px solid var(--line); border-radius:6px;
    background:var(--panel2); color:var(--dim); cursor:pointer;
    padding:4px 3px; text-align:center; font-size:11.5px; line-height:1.2;
    transition:background .1s, color .1s;
  }
  .tbtn:hover{color:var(--text);}
  .tbtn.active{background:var(--sc); color:var(--ink,#000); border-color:var(--sc); font-weight:700;}
  .stampGrid{display:grid; grid-template-columns:1fr 1fr; gap:4px;}
  .stampGrid .toggle{padding:6px 4px; text-align:center; font-size:12px;}
  /* ---------- stage ---------- */
  #stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    min-width:0; min-height:0; padding:14px; position:relative;
  }
  #wrap{
    position:relative; aspect-ratio:1/1;
    height:min(100%, 100vw - 560px);
    max-width:100%;
    box-shadow:0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.5);
  }
  #art, #ui{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #art{ image-rendering:pixelated; image-rendering:crisp-edges; }
  #ui{ cursor:crosshair; touch-action:none; }
  /* ---------- right panel ---------- */
  #side{
    flex:0 0 288px; background:var(--panel); border-left:1px solid var(--line);
    padding:10px 12px; display:flex; flex-direction:column; gap:10px; overflow-y:auto;
  }
  .sec{display:flex; flex-direction:column; gap:6px;}
  .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  input[type=color]{
    width:38px; height:30px; border:1px solid var(--line); border-radius:6px;
    background:var(--panel2); cursor:pointer; padding:2px;
  }
  .toggle{
    border:1px solid var(--line); background:var(--panel2); color:var(--dim);
    padding:5px 8px; border-radius:6px; cursor:pointer; font-size:12px;
  }
  .toggle.on, #tools .toggle.on, #side .toggle.on{background:var(--sc); color:var(--ink,#000); border-color:var(--sc); font-weight:700;}
  .pal{display:grid; grid-template-columns:repeat(8,1fr); gap:3px;}
  .sw{aspect-ratio:1; border-radius:3px; cursor:pointer; border:1px solid rgba(0,0,0,.45);}
  .sw:hover{outline:2px solid var(--sct,var(--sc));}
  input[type=range]{width:100%; accent-color:var(--sc);}
  .val{color:var(--sct,var(--sc)); min-width:26px; text-align:right; font-weight:700;}
  .act{
    border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12px;
  }
  .act:hover{border-color:var(--dim);}
  .act.primary{background:var(--sc); color:var(--ink,#000); border-color:var(--sc); font-weight:700;}
  .act.warn{color:var(--danger);}
  .g2{display:grid; grid-template-columns:1fr 1fr; gap:4px;}
  .g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px;}
  #tilePrev{
    width:120px; height:120px; align-self:flex-start; image-rendering:pixelated;
    border:1px solid var(--line); border-radius:6px; background:#0b0d10;
  }
  .hint{color:var(--dim); font-size:11px; line-height:1.45;}
  #layerList{display:flex; flex-direction:column; gap:3px; max-height:100px; overflow-y:auto;}
  .lrow{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--panel2);
    border-radius:6px; padding:4px 7px; cursor:pointer; flex:0 0 auto;
  }
  .lrow.active{border-color:var(--sct,var(--sc)); box-shadow:inset 0 0 0 1px var(--sct,var(--sc));}
  .lrow .lname{flex:1;}
  .lrow.hidden .lname{opacity:.35;}
  .icobtn{
    background:none; border:none; color:var(--dim); cursor:pointer;
    font-size:13px; padding:2px 4px; font-family:inherit;
  }
  .icobtn:hover{color:var(--text);}
  .icobtn.eye.on{color:var(--sct,var(--sc));}
  #hueBar{
    height:16px; border-radius:6px; border:1px solid var(--line);
    background:linear-gradient(90deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);
  }
  #gradPreviewWrap{position:relative;}
  #gradPreview{ height:18px; border-radius:6px; border:1px solid var(--line); }
  #gradPreviewWrap select{
    position:absolute; inset:0; width:100%; height:100%; min-height:0;
    opacity:0; cursor:pointer;
  }
  .act.mini{padding:3px 8px; font-size:11px;}
  #palettePanel{max-width:520px;}
  #sizePanel{max-width:400px;}
  #sizeHead{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  #sizeCustom{
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:6px; padding:7px 9px; font-family:inherit; font-size:13px; text-align:center;
  }
  #sizeList{
    padding:12px; display:grid; grid-template-columns:repeat(3, 1fr);
    gap:8px; overflow-y:auto;
  }
  .sizeCard{
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    border:1px solid var(--line); background:var(--panel2);
    border-radius:9px; padding:9px 6px;
  }
  .sizeCard:hover{border-color:var(--pc,var(--sct));}
  .sizeCard.sel{border-color:var(--pc,var(--sct)); box-shadow:inset 0 0 0 1px var(--pc,var(--sct));}
  .sizeCard .slabel{
    font-family:'Space Mono', monospace; font-weight:700; font-size:13px;
    letter-spacing:0; color:var(--pc,#fff);
  }
  .sizeChipBox{
    width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  }
  .sizeChip{
    border-radius:3px; border:1px solid var(--line);
    background-image:
      linear-gradient(var(--pc) 1px, transparent 1px),
      linear-gradient(90deg, var(--pc) 1px, transparent 1px);
    background-color:#12151a;
  }
  #paletteList{padding:12px; display:flex; flex-direction:column; gap:8px; overflow-y:auto;}
  .palRow{
    display:flex; flex-direction:column; gap:5px; cursor:pointer;
    border:1px solid var(--line); border-radius:9px; padding:8px 10px;
    background:var(--panel2);
  }
  .palRow:hover{border-color:var(--sct);}
  .palRow.sel{border-color:var(--sct); box-shadow:inset 0 0 0 1px var(--sct);}
  .palRow .pname{
    font-family:'Pixelify Sans', monospace; font-size:14px; letter-spacing:1.5px;
    color:var(--pc,#fff);
  }
  .palStrip{display:flex; height:20px; border-radius:4px; overflow:hidden;}
  .palStrip span{flex:1;}
  .palGroup{
    font-family:'Pixelify Sans', monospace; font-size:12px; letter-spacing:2px;
    color:var(--dim); margin-top:4px;
  }
  /* rainbow-per-button: violet at the start of each row, red at the end */
  #mbar .mbtn:nth-child(1){--sc:#BF00FF; --sct:#D480FF;}
  #mbar .mbtn:nth-child(2){--sc:#7F5CFF; --sct:#A78CFF;}
  #mbar .mbtn:nth-child(3){--sc:#4D8CFF; --sct:#7FB0FF;}
  #mbar .mbtn:nth-child(4){--sc:#00CCFF; --sct:#66DFFF;}
  #mbar .mbtn:nth-child(5){--sc:#00FFB2; --sct:#66FFD1;}
  #mbar .mbtn:nth-child(6){--sc:#7FFF00; --sct:#A9FF5C;}
  #mbar .mbtn:nth-child(7){--sc:#FFE500; --sct:#FFEE5C;}
  #mbar .mbtn:nth-child(8){--sc:#FF9500; --sct:#FFB44D;}
  #bbar .mbtn:nth-child(1){--sc:#FFCC00; --sct:#FFDD55;}
  #bbar .mbtn:nth-child(2){--sc:#FF7F00; --sct:#FFA24D;}
  #bbar .mbtn:nth-child(3){--sc:#FF2B2B; --sct:#FF6B6B;}
  .mbtn{color:var(--sct,var(--text));}
  .mbtn .ml{color:var(--sct,var(--dim));}
  .mbtn{border-color:var(--sct,var(--line));}
  #mbar .mbtn.active, #bbar .mbtn.active{background:var(--sc); border-color:var(--sc); color:#000;}
  #mbar .mbtn.active .ml, #bbar .mbtn.active .ml{color:#000; font-weight:700;}
  /* color-mode row: each control its own hue */
  #s-color .row > *:nth-child(2){--sc:#BF00FF; --sct:#D480FF;}
  #s-color .row > *:nth-child(3){--sc:#4D8CFF; --sct:#7FB0FF;}
  #s-color .row > *:nth-child(4){--sc:#00FFB2; --sct:#66FFD1;}
  #s-color .row > *:nth-child(5){--sc:#FFE500; --sct:#FFEE5C;}
  #s-color .row > *:nth-child(6){--sc:#FF7F00; --sct:#FFA24D;}
  #s-color .row .toggle{border-color:var(--sct); color:var(--sct); background:var(--panel2);}
  #s-color .row select{border-color:var(--sct); color:var(--sct);}
  #s-color .row #palSelect{border-color:var(--sct); color:var(--sct);}
  #s-color .row .toggle.on{background:var(--sct); color:#000; border-color:var(--sct); font-weight:700;}
  /* tool buttons inside a panel: spectrum sweep across the grid */
  .tgrid .tbtn:nth-child(1){--sct:#E58CFF;}
  .tgrid .tbtn:nth-child(2){--sct:#A78CFF;}
  .tgrid .tbtn:nth-child(3){--sct:#7FB0FF;}
  .tgrid .tbtn:nth-child(4){--sct:#66DFFF;}
  .tgrid .tbtn:nth-child(5){--sct:#66FFD1;}
  .tgrid .tbtn:nth-child(6){--sct:#A9FF5C;}
  .tgrid .tbtn{color:var(--sct); border-color:var(--sct); background:var(--panel2);}
  .tgrid .tbtn.active,
  #tools .tgrid .tbtn.active,
  #side .tgrid .tbtn.active{background:var(--sct); color:#000; border-color:var(--sct); font-weight:700;}
  #s-color .row .toggle, #s-color .row select{font-size:12px;}
  /* remix modal */
  #remixModal, #galleryModal, #paletteModal, #sizeModal{
    position:fixed; inset:0; background:rgba(5,7,10,.84); z-index:50;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  #remixModal.open, #galleryModal.open, #paletteModal.open, #sizeModal.open{display:flex;}
  #remixPanel, #galleryPanel, #palettePanel, #sizePanel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    max-width:920px; width:100%; max-height:88vh; display:flex; flex-direction:column;
  }
  #remixHead, #paletteHead{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  #galleryHead{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 16px; border-bottom:1px solid var(--line);
  }
  #galleryHead .g2{width:min(100%, 320px);}
  #galleryGrid .rmx canvas{width:100%;}
  #remixHead h2, #galleryHead h2, #paletteHead h2, #sizeHead h2{font-family:'Pixelify Sans',monospace; letter-spacing:2px; color:var(--sct,var(--sc)); font-size:16px;}
  #remixGrid, #galleryGrid{
    padding:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(165px,1fr));
    gap:14px; overflow-y:auto;
  }
  .rmx{display:flex; flex-direction:column; gap:6px;}
  .rmx canvas{
    width:100%; aspect-ratio:1; image-rendering:pixelated;
    border:1px solid var(--line); border-radius:6px;
    background:repeating-conic-gradient(#20242c 0% 25%, #171a20 0% 50%);
    background-size:12.5% 12.5%;
  }
  .rmx .row{gap:4px; flex-wrap:nowrap;}
  .rmx .act{flex:1; padding:5px 2px; font-size:11px;}
  @media (max-width:1000px) and (min-width:761px){
    #tools{flex-basis:150px;}
    #side{flex-basis:240px;}
    #wrap{height:min(100%, 100vw - 440px);}
  }
  /* ---------- phone layout: icon bar + dropdowns, canvas front and center ---------- */
  @media (max-width:760px){
    body{overflow-x:hidden; overflow-y:auto; height:auto; min-height:100%;}
    header{flex-wrap:wrap; gap:5px; padding:4px 8px; justify-content:center;}
    #titleBlock{flex-basis:100%; text-align:center;}
    header .spacer{display:none;}
    #galleryBtn{order:1; padding:6px 12px;}
    header .bar-group{order:2;}
    #gridSize{font-size:13px; min-height:30px; padding:2px 4px;}
    h1{font-size:15px;}
    #topbars{
      display:block; position:sticky; top:0; z-index:30;
      background:var(--panel2); border-bottom:1px solid var(--line);
    }
    #mtop{display:flex; flex-direction:column; gap:2px; padding:4px 8px 2px;}
    #mtop h2{display:none;}
    #mtopRow{display:flex; align-items:center; gap:8px;}
    #mtopRow .sec{flex:1; display:flex; flex-direction:row; gap:8px; min-width:0;}
    #mtopRow .sec .row{flex:1; min-width:0; gap:4px; flex-wrap:nowrap;}
    #mtopRow .tag{font-size:9px;}
    #mtopRow .val{min-width:18px; font-size:12px;}
    #mtopBtns{display:flex; gap:5px;}
    #mtopBtns .act{font-size:18px; line-height:1; padding:7px 11px;}
    #mtopColor .sec{display:flex; flex-direction:column; gap:4px; padding-top:0;}
    #mtopColor .tag{display:none;}
    #mtop #palManage .act{padding:5px 4px; font-size:11px;}
    #mtop .pal{gap:2px;}
    #mtop .sw{aspect-ratio:auto; height:22px; border-radius:2px;}
    #mtop input[type=color]{width:34px; height:30px;}
    #mtop select{min-height:30px; font-size:12px; padding:2px 4px;}
    #mtop .toggle{padding:4px 6px; font-size:12px;}
    #mtop #gradEditor{gap:3px;}
    #mtop #gradPreview{height:13px;}
    #mtop #hueBar{height:13px;}
    #mtop #gradPreviewWrap select{position:absolute; min-height:0; height:100%; opacity:0;}
    #mtop #gradStops input[type=color]{width:26px; height:22px;}
    #mtop .act.mini{padding:2px 6px; font-size:10px;}
    #mtop #cycleRow input[type=range]{height:18px;}
    #mtop #palSelect{min-width:60px; font-size:12px; min-height:30px;}
    #mtop .sw{height:20px;}
    #mtop input[type=color]{width:32px; height:28px;}
    #mbar{
      display:flex; flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start;
      background:transparent; border-bottom:none; padding:2px 4px 5px;
    }
    #mbar .mbtn:first-child{margin-left:auto;}
    #mbar .mbtn:last-child{margin-right:auto;}
    .mbtn{min-width:40px; padding:3px 3px;}
    .mbtn .mi{font-size:14px;}
    .mbtn .ml{font-size:8px;}
    main{display:flex; flex-direction:column; overflow:visible;}
    #tools, #side{display:contents;}
    #tools .group, #side > .sec{display:none;}
    #stage{order:0; flex:0 0 auto; padding:6px; justify-content:center;}
    #wrap{width:min(96vw, 66vh); height:auto;}
    #bbar{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:35;
      justify-content:center; gap:14px; padding:4px 8px calc(4px + env(safe-area-inset-bottom));
      background:var(--panel2); border-top:1px solid var(--line);
    }
    main{padding-bottom:64px;}
    #tilePrev{align-self:center;}
    #g-tile.mopen{
      left:50%; right:auto; bottom:auto; top:16vh; transform:translateX(-50%);
      width:min(72vw, 330px);
    }
    #g-tile.mopen #tilePrev{width:100%; height:auto; aspect-ratio:1;}
    #undoBtn, #redoBtn{display:none;}
    .mopen{
      display:flex !important; position:fixed; left:8px; right:8px; bottom:64px; top:auto;
      z-index:40; background:var(--panel); border:1px solid var(--line);
      border-radius:12px; padding:14px; max-height:62vh; overflow-y:auto;
      box-shadow:0 18px 50px rgba(0,0,0,.65);
    }
    .tbtn{padding:11px 6px; font-size:13px;}
    .act, .toggle{padding:11px 8px; font-size:13px;}
    select{min-height:42px; font-size:16px;}
    input[type=color]{width:48px; height:42px;}
    #tilePrev{width:150px; height:150px;}
    #layerList{max-height:150px;}
    #remixGrid, #galleryGrid{grid-template-columns:repeat(auto-fill, minmax(130px,1fr));}
  }
</style>
</head>
<body>

<header>
  <div id="titleBlock">
    <h1><span style="color:#FF4040">P</span><span style="color:#FF8C1A">I</span><span style="color:#FFE81A">X</span><span style="color:#33FF33">E</span><span style="color:#33E0FF">L</span><span style="color:#4D8CFF">P</span><span style="color:#8C66FF">L</span><span style="color:#C44DFF">A</span><span style="color:#FF4DD8">Y</span> <span style="color:var(--text);">by Paula</span></h1>
    <div id="subtitle" style="font-size:11px; color:var(--text); opacity:.75; letter-spacing:1px; margin-top:1px;">pixel texture creation tool</div>
  </div>
  <div class="bar-group">
    <button class="act" id="gridSize">128 × 128</button>
  </div>
  <div class="spacer"></div>
  <button class="act" id="undoBtn" title="Ctrl+Z">Undo</button>
  <button class="act" id="redoBtn" title="Ctrl+Shift+Z">Redo</button>
  <button class="act primary" id="galleryBtn">Projects</button>
</header>

<div id="topbars">
<div id="mtop">
  <div id="mtopRow">
    <div id="mtopBtns">
      <button class="act" id="mUndo" title="Undo">↺</button>
      <button class="act" id="mRedo" title="Redo">↻</button>
    </div>
  </div>
  <div id="mtopColor"></div>
</div>
<div id="mbar">
  <button class="mbtn" data-panel="g-tools"><span class="mi">🖍️</span><span class="ml">Tools</span></button>
  <button class="mbtn" data-panel="g-shapes"><span class="mi">💠</span><span class="ml">Shapes</span></button>
  <button class="mbtn" data-panel="g-stamps"><span class="mi">👾</span><span class="ml">Stamps</span></button>
  <button class="mbtn" data-panel="g-patterns"><span class="mi">🌿</span><span class="ml">Pattern</span></button>
  <button class="mbtn" data-panel="g-dither"><span class="mi">🌗</span><span class="ml">Dither</span></button>
  <button class="mbtn" data-panel="g-effects"><span class="mi">✨</span><span class="ml">Effects</span></button>
  <button class="mbtn" data-panel="s-layers"><span class="mi">🗂️</span><span class="ml">Layers</span></button>
  <button class="mbtn" data-panel="s-mirror"><span class="mi">🪞</span><span class="ml">Mirror</span></button>
</div>
</div>

<div id="bbar">
  <button class="mbtn" data-panel="g-tile"><span class="mi">🧱</span><span class="ml">Tile</span></button>
  <button class="mbtn" data-panel="s-export"><span class="mi">📤</span><span class="ml">Export</span></button>
  <button class="mbtn" data-panel="s-remix"><span class="mi">🎲</span><span class="ml">Remix</span></button>
</div>

<main>
  <nav id="tools">
    <div class="group" id="g-tools" style="--sc:#FF00FF; --sct:#FF5CFF;">
      <h2>TOOLS</h2>
      <div class="tgrid">
        <button class="tbtn active" data-tool="pencil" title="Shortcut: B">Pencil</button>
        <button class="tbtn" data-tool="spray"  title="Shortcut: S">Spray Can</button>
        <button class="tbtn" data-tool="eraser" title="Shortcut: E">Eraser</button>
        <button class="tbtn" data-tool="bucket" title="Shortcut: G">Bucket Fill</button>
        <button class="tbtn" data-tool="picker" title="Shortcut: I">Eyedropper</button>
      </div>
      <button class="toggle on" id="gridToggle">Show Grid</button>
    </div>
    <div class="group" id="g-shapes" style="--sc:#7F00FF; --ink:#ffffff; --sct:#B57BFF;">
      <h2>SHAPES</h2>
      <select id="shapeSelect">
        <option value="line">Line</option>
        <option value="circle" selected>Circle</option>
        <option value="square">Square</option>
        <option value="rect">Rectangle</option>
        <option value="triangle">Triangle</option>
        <option value="diamond">Diamond</option>
      </select>
    </div>
    <div class="group" id="g-stamps" style="--sc:#4000FF; --ink:#ffffff; --sct:#9E8CFF;">
      <h2>STAMPS</h2>
      <select id="stampSelect">
        <option value="human" selected>Human</option>
        <option value="dog">Dog</option>
        <option value="cat">Cat</option>
        <option value="bird">Bird</option>
        <option value="fish">Fish</option>
        <option value="tree">Tree</option>
        <option value="flower">Flower</option>
        <option value="mushroom">Mushroom</option>
        <option value="house">House</option>
        <option value="eye">Eye</option>
        <option value="star">Star</option>
        <option value="heart">Heart</option>
        <option value="moon">Moon</option>
        <option value="lightning">Lightning</option>
        <option value="skull">Skull</option>
        <option value="ghost">Ghost</option>
      </select>
    </div>
    <div class="group" id="g-patterns" style="--sc:#0000FF; --ink:#ffffff; --sct:#8F9BFF;">
      <h2>PATTERNS</h2>
      <div class="tgrid">
        <button class="tbtn" data-tool="fractal" title="Shortcut: F">Fractal</button>

<script>
(() => {
"use strict";

/* ============ state ============ */
const S = {
  N: 32,
  tool: 'pencil',
  color: '#ff00ff',
  colorMode: 'solid',
  hueStep: 9,
  hueCursor: 0,
  gradient: ['#ff00ff','#00ffff','#39ff14'],
  mirrorX: false,
  mirrorY: false,
  size: 4,
  power: 5,
  showGrid: true,
  drawing: false,
  cell: {x:-1, y:-1},
  lastCell: null,
  shape: 'circle',
  fillOutline: false,
  stampShape: 'human',
  erasing: false,
  tileN: 3,
  ditherMode: 'linear',
  customPal: [],
};

let layers = [];
let active = 0;
let comp;
let layerCounter = 0;
const MAX_LAYERS = 24;
let undoStack = [], redoStack = [];
const UNDO_MAX = 30;

const art  = document.getElementById('art');
const actx = art.getContext('2d');
const ui   = document.getElementById('ui');
const uctx = ui.getContext('2d');
const wrap = document.getElementById('wrap');
const tile = document.getElementById('tilePrev');
const tctx = tile.getContext('2d');

/* ============ safe persistent storage ============ */
/* Uses localStorage when the file is opened directly in a browser;
   silently falls back to in-memory storage (session-only) elsewhere. */
const memStore = {};
const store = {
  get(k){
    try{ const v = localStorage.getItem(k); if(v !== null) return JSON.parse(v); }catch(e){}
    return memStore[k] ?? null;
  },
  set(k,v){
    memStore[k] = v;
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  },
};
let savedPalettes  = store.get('pf_palettes')  || {};
let savedGradients = store.get('pf_gradients') || {};

/* ============ helpers ============ */
const idx = (x,y) => (y*S.N + x) * 4;
const inB = (x,y) => x>=0 && y>=0 && x<S.N && y<S.N;
const wrapC = v => ((v % S.N) + S.N) % S.N;
const A = () => layers[active].pix;
const rnd = (a,b) => a + Math.random()*(b-a);
const ri  = (a,b) => Math.floor(rnd(a,b+1));

function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){
    const d=mx-mn;
    s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    switch(mx){
      case r: h=(g-b)/d + (g<b?6:0); break;
      case g: h=(b-r)/d + 2; break;
      default: h=(r-g)/d + 4;
    }
    h*=60;
  }
  return [h,s,l];
}
function hslToRgb(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
const hsl = (h,s,l) => rgbToHex(...hslToRgb(h,s,l));

/* ---- gradient sampling ---- */
function gradSample(t){
  const stops = S.gradient.map(hexToRgb);
  const n = stops.length;
  if(n === 1) return stops[0];
  const f = Math.min(1, Math.max(0, t)) * (n-1);
  const i = Math.min(n-2, Math.floor(f));
  const u = f - i;
  return [
    Math.round(stops[i][0]*(1-u) + stops[i+1][0]*u),
    Math.round(stops[i][1]*(1-u) + stops[i+1][1]*u),
    Math.round(stops[i][2]*(1-u) + stops[i+1][2]*u),
  ];
}
function cyclePos(){
  const p = (S.hueCursor % 720) / 360;
  return p <= 1 ? p : 2 - p;
}
function paintColor(){
  if(S.colorMode === 'solid') return [...hexToRgb(S.color), 255];
  if(S.colorMode === 'hue'){
    const [r,g,b] = hexToRgb(S.color);
    const [h,s,l] = rgbToHsl(r,g,b);
    const out = hslToRgb(h + S.hueCursor, Math.max(s,0.45), l);
    S.hueCursor = (S.hueCursor + S.hueStep) % 720;
    return [out[0], out[1], out[2], 255];
  }
  const c = gradSample(cyclePos());
  S.hueCursor = (S.hueCursor + S.hueStep) % 720;
  return [c[0], c[1], c[2], 255];
}
function colorAtY(y){
  if(S.colorMode === 'solid') return [...hexToRgb(S.color), 255];
  if(S.colorMode === 'hue'){
    const [r,g,b] = hexToRgb(S.color);
    const [h,s,l] = rgbToHsl(r,g,b);
    const out = hslToRgb(h + (y/S.N)*360, Math.max(s,0.45), l);
    return [out[0], out[1], out[2], 255];
  }
  const c = gradSample(y / Math.max(1, S.N-1));
  return [c[0], c[1], c[2], 255];
}

/* ============ layers ============ */
function newLayer(name){
  return { name: name || ('Layer ' + (++layerCounter)), visible:true, pix:new Uint8ClampedArray(S.N*S.N*4) };
}
function addLayer(pixData){
  if(layers.length >= MAX_LAYERS){ alert('Maximum ' + MAX_LAYERS + ' layers.'); return; }
  snapshot();
  const l = newLayer();
  if(pixData) l.pix.set(pixData);
  layers.splice(active+1, 0, l);
  active = active+1;
  renderLayerList(); render();
}
function duplicateLayer(){
  if(layers.length >= MAX_LAYERS){ alert('Maximum ' + MAX_LAYERS + ' layers.'); return; }
  snapshot();
  const srcL = layers[active];
  layers.splice(active+1, 0, { name: srcL.name + ' copy', visible:true, pix: srcL.pix.slice() });
  active = active+1;
  renderLayerList(); render();
}
function removeActiveLayer(){
  if(layers.length <= 1){ alert('Cannot remove the last layer.'); return; }
  if(!confirm('Delete "' + layers[active].name + '"?')) return;
  snapshot();
  layers.splice(active,1);
  if(active >= layers.length) active = layers.length-1;
  renderLayerList(); render();
}
function moveLayer(dir){
  const j = active + dir;
  if(j < 0 || j >= layers.length) return;
  snapshot();
  const t = layers[active]; layers[active] = layers[j]; layers[j] = t;
  active = j;
  renderLayerList(); render();
}
function renderLayerList(){
  const el = document.getElementById('layerList');
  el.innerHTML = '';
  for(let i = layers.length-1; i >= 0; i--){
    const L = layers[i];
    const row = document.createElement('div');
    row.className = 'lrow' + (i===active ? ' active':'') + (L.visible ? '' : ' hidden');
    const eye = document.createElement('button');
    eye.className = 'icobtn eye' + (L.visible?' on':'');
    eye.textContent = L.visible ? '◉' : '◌';
    eye.title = L.visible ? 'Hide this layer' : 'Show this layer';
    eye.addEventListener('click', ev => {
      ev.stopPropagation();
      L.visible = !L.visible;
      renderLayerList(); render();
    });
    const name = document.createElement('span');
    name.className = 'lname';
    name.textContent = L.name;
    row.addEventListener('click', () => { active = i; renderLayerList(); drawOverlay(); });
    row.appendChild(eye); row.appendChild(name);
    el.appendChild(row);
  }
}

/* ============ core canvas ============ */
function initCanvas(n){
  S.N = n;
  layerCounter = 0;
  layers = [newLayer()];
  active = 0;
  comp = new Uint8ClampedArray(n*n*4);
  art.width = n; art.height = n;
  tile.width = n*S.tileN; tile.height = n*S.tileN;
  undoStack = []; redoStack = [];
  const bs = document.getElementById('brushSize');
  bs.max = n;
  if(S.size > n){ S.size = Math.floor(n/4); }
  bs.value = S.size;
  document.getElementById('brushSizeVal').textContent = S.size;
  const cell = 200 / n;
  wrap.style.background = 'repeating-conic-gradient(#20242c 0% 25%, #171a20 0% 50%)';
  wrap.style.backgroundSize = cell + '% ' + cell + '%';
  renderLayerList();
  render();
}
function composite(){
  comp.fill(0);
  for(const L of layers){
    if(!L.visible) continue;
    const p = L.pix;
    for(let i=0; i<p.length; i+=4){
      const a = p[i+3];
      if(a === 0) continue;
      if(a === 255 || comp[i+3] === 0){
        comp[i]=p[i]; comp[i+1]=p[i+1]; comp[i+2]=p[i+2]; comp[i+3]=a;
      } else {
        const af = a/255, bf = comp[i+3]/255 * (1-af), o = af+bf;
        comp[i]   = (p[i]*af   + comp[i]*bf)   / o;
        comp[i+1] = (p[i+1]*af + comp[i+1]*bf) / o;
        comp[i+2] = (p[i+2]*af + comp[i+2]*bf) / o;
        comp[i+3] = o*255;
      }
    }
  }
}
function render(){
  composite();
  actx.putImageData(new ImageData(comp.slice(), S.N, S.N), 0, 0);
  tctx.imageSmoothingEnabled = false;
  tctx.clearRect(0,0,tile.width,tile.height);
  for(let ty=0; ty<S.tileN; ty++) for(let tx=0; tx<S.tileN; tx++)
    tctx.drawImage(art, tx*S.N, ty*S.N);
  drawOverlay();
  if(typeof scheduleAutosave === 'function') scheduleAutosave();
}

/* ============ overlay ============ */
function fitOverlay(){
  const dpr = window.devicePixelRatio || 1;
  ui.width  = Math.round(wrap.clientWidth  * dpr);
  ui.height = Math.round(wrap.clientHeight * dpr);
  drawOverlay();
}
function drawOverlay(){
  const w = ui.width, h = ui.height, cs = w / S.N;
  uctx.clearRect(0,0,w,h);
  if(S.showGrid && S.N <= 64){
    uctx.strokeStyle = 'rgba(255,255,255,0.07)';
    uctx.lineWidth = 1;
    uctx.beginPath();
    for(let i=1;i<S.N;i++){
      uctx.moveTo(i*cs, 0); uctx.lineTo(i*cs, h);
      uctx.moveTo(0, i*cs); uctx.lineTo(w, i*cs);
    }
    uctx.stroke();
  }
  uctx.setLineDash([6,6]);
  uctx.lineWidth = Math.max(1, w/500);
  if(S.mirrorX){
    uctx.strokeStyle = 'rgba(0,255,0,0.85)';
    uctx.beginPath(); uctx.moveTo(w/2,0); uctx.lineTo(w/2,h); uctx.stroke();
  }
  if(S.mirrorY){
    uctx.strokeStyle = 'rgba(0,255,0,0.85)';
    uctx.beginPath(); uctx.moveTo(0,h/2); uctx.lineTo(w,h/2); uctx.stroke();
  }
  uctx.setLineDash([]);
  const {x,y} = S.cell;
  if(inB(x,y)){
    uctx.strokeStyle = 'rgba(255,255,255,0.85)';
    uctx.lineWidth = Math.max(1.5, w/400);
    const areaTools = ['spray','swirl','distort','dither','melt','sort','wave','spiral','fractal','tree','life','stampc'];
    if(areaTools.includes(S.tool)){
      const r = S.size;
      uctx.strokeRect((x-r)*cs, (y-r)*cs, (2*r+1)*cs, (2*r+1)*cs);
    } else {
      uctx.strokeRect(x*cs, y*cs, cs, cs);
    }
  }
}

/* ============ pixel ops ============ */
function mirrorPoints(x,y){
  const pts = [[x,y]];
  if(S.mirrorX) pts.push([S.N-1-x, y]);
  if(S.mirrorY) pts.push([x, S.N-1-y]);
  if(S.mirrorX && S.mirrorY) pts.push([S.N-1-x, S.N-1-y]);
  return pts;
}
function setPx(arr,x,y,c){
  if(!inB(x,y)) return;
  const i = idx(x,y);
  arr[i]=c[0]; arr[i+1]=c[1]; arr[i+2]=c[2]; arr[i+3]=c[3];
}
function stamp(x,y,c){ for(const [px,py] of mirrorPoints(x,y)) setPx(A(),px,py,c); }

function line(x0,y0,x1,y1,fn){
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0);
  const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx+dy;
  for(;;){
    fn(x0,y0);
    if(x0===x1 && y0===y1) break;
    const e2=2*err;
    if(e2>=dy){err+=dy; x0+=sx;}
    if(e2<=dx){err+=dx; y0+=sy;}
  }
}
function flood(x,y,colorFn){
  if(!inB(x,y)) return;
  const arr = A();
  const t = idx(x,y);
  const tr=arr[t],tg=arr[t+1],tb=arr[t+2],ta=arr[t+3];
  const stack=[[x,y]];
  const seen=new Uint8Array(S.N*S.N);
  while(stack.length){
    const [cx,cy]=stack.pop();
    if(!inB(cx,cy)) continue;
    const s=cy*S.N+cx;
    if(seen[s]) continue;
    seen[s]=1;
    const i=s*4;
    if(arr[i]!==tr||arr[i+1]!==tg||arr[i+2]!==tb||arr[i+3]!==ta) continue;
    const c=colorFn(cx,cy);
    arr[i]=c[0];arr[i+1]=c[1];arr[i+2]=c[2];arr[i+3]=c[3];
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

/* ============ effect brushes ============ */
function swirlStrength(r){
  return 0.045*S.power + (0.6*S.power)/(r+3);
}
function swirlArr(arr, N, cx, cy, r, strength){
  const src = arr.slice();
  const wp = v => ((v % N) + N) % N;
  for(let y=cy-r; y<=cy+r; y++){
    for(let x=cx-r; x<=cx+r; x++){
      const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
      if(d>r) continue;
      const ang = strength * (1 - d/(r+1));
      const ca=Math.cos(ang), sa=Math.sin(ang);
      const sx = wp(Math.round(cx + dx*ca - dy*sa));
      const sy = wp(Math.round(cy + dx*sa + dy*ca));
      const di = (wp(y)*N + wp(x))*4, si = (sy*N + sx)*4;
      arr[di]=src[si]; arr[di+1]=src[si+1]; arr[di+2]=src[si+2]; arr[di+3]=src[si+3];
    }
  }
}
function distortArr(arr, N, cx, cy, r, j, chance){
  const src = arr.slice();
  const wp = v => ((v % N) + N) % N;
  for(let y=cy-r; y<=cy+r; y++){
    for(let x=cx-r; x<=cx+r; x++){
      if(Math.hypot(x-cx,y-cy)>r) continue;
      if(Math.random()>chance) continue;
      const sx = wp(x + ri(-j,j)), sy = wp(y + ri(-j,j));
      const di = (wp(y)*N + wp(x))*4, si = (sy*N + sx)*4;
      arr[di]=src[si]; arr[di+1]=src[si+1]; arr[di+2]=src[si+2]; arr[di+3]=src[si+3];
    }
  }
}
function meltArr(arr, N, cx, cy, r, power){
  const chance = Math.min(0.95, 0.15 + 0.09*power);
  const substeps = 1 + Math.floor(power/3);
  for(let s=0; s<substeps; s++){
    for(let y=Math.min(N-2, cy+r); y>=Math.max(0, cy-r); y--){
      for(let x=Math.max(0,cx-r); x<=Math.min(N-1,cx+r); x++){
        if(Math.hypot(x-cx,y-cy)>r+1) continue;
        const i=(y*N+x)*4;
        if(arr[i+3]===0) continue;
        if(Math.random()>chance) continue;
        const below=((y+1)*N+x)*4;
        if(arr[below+3]===0){
          for(let k=0;k<4;k++) arr[below+k]=arr[i+k];
          arr[i+3]=0;
          continue;
        }
        const dir = Math.random()<0.5 ? -1 : 1;
        for(const dx of [dir, -dir]){
          const nx = x+dx;
          if(nx<0 || nx>=N) continue;
          const diag=((y+1)*N+nx)*4;
          if(arr[diag+3]===0){
            for(let k=0;k<4;k++) arr[diag+k]=arr[i+k];
            arr[i+3]=0;
            break;
          }
        }
      }
    }
  }
}
function sortArr(arr, N, cx, cy, r){
  const lum = (p) => p[3]===0 ? -1 : p[0]*0.299 + p[1]*0.587 + p[2]*0.114;
  for(let y=Math.max(0,cy-r); y<=Math.min(N-1,cy+r); y++){
    const x0=Math.max(0,cx-r), x1=Math.min(N-1,cx+r);
    const seg=[];
    for(let x=x0;x<=x1;x++){
      const i=(y*N+x)*4;
      seg.push([arr[i],arr[i+1],arr[i+2],arr[i+3]]);
    }
    seg.sort((a,b)=>lum(a)-lum(b));
    for(let x=x0;x<=x1;x++){
      const p=seg[x-x0], i=(y*N+x)*4;
      arr[i]=p[0];arr[i+1]=p[1];arr[i+2]=p[2];arr[i+3]=p[3];
    }
  }
}
function swirlAt(cx,cy){
  const r = Math.max(2, S.size);
  for(const [mx,my] of mirrorPoints(cx,cy))
    swirlArr(A(), S.N, mx, my, r, swirlStrength(r));
}
function distortAt(cx,cy){
  for(const [mx,my] of mirrorPoints(cx,cy))
    distortArr(A(), S.N, mx, my, S.size, Math.max(1,Math.round(S.power/3)), 0.06*S.power);
}
function meltAt(cx,cy){
  for(const [mx,my] of mirrorPoints(cx,cy))
    meltArr(A(), S.N, mx, my, S.size, S.power);
}
function sortAt(cx,cy){
  for(const [mx,my] of mirrorPoints(cx,cy))
    sortArr(A(), S.N, mx, my, S.size);
}
let wavePhase = 0;
function waveArr(arr, N, cx, cy, r, phase, power){
  const src = arr.slice();
  const wp = v => ((v % N) + N) % N;
  for(let y=cy-r; y<=cy+r; y++){
    const fall = 1 - Math.abs(y-cy)/(r+1);
    const off = Math.round(Math.sin(y*0.7 + phase) * (1 + power*0.45) * fall);
    if(off === 0) continue;
    for(let x=cx-r; x<=cx+r; x++){
      if(Math.hypot(x-cx,y-cy)>r) continue;
      const di = (wp(y)*N + wp(x))*4;
      const si = (wp(y)*N + wp(x+off))*4;
      arr[di]=src[si]; arr[di+1]=src[si+1]; arr[di+2]=src[si+2]; arr[di+3]=src[si+3];
    }
  }
}
function waveAt(cx,cy){
  wavePhase += 0.3;
  for(const [mx,my] of mirrorPoints(cx,cy))
    waveArr(A(), S.N, mx, my, S.size, wavePhase, S.power);
}
function ditherAt(cx,cy){
  const r = S.size;
  for(let y=cy-r; y<=cy+r; y++){
    for(let x=cx-r; x<=cx+r; x++){
      if(Math.hypot(x-cx,y-cy)>r) continue;
      if(((x%2+2)%2) !== ((y%2+2)%2)) continue;
      stamp(wrapC(x), wrapC(y), colorAtY(wrapC(y)));
    }
  }
}
function sprayAt(cx,cy){
  const r = S.size, count = Math.max(2, Math.round(S.power * r * 0.6));
  for(let i=0;i<count;i++){
    const a = Math.random()*Math.PI*2, d = Math.sqrt(Math.random())*r;
    const x = cx + Math.round(Math.cos(a)*d);
    const y = cy + Math.round(Math.sin(a)*d);
    if(!inB(x,y)) continue;
    stamp(x, y, paintColor());
  }
}
function outlineLayer(){
  const arr = A();
  const src = arr.slice();
  for(let y=0;y<S.N;y++){
    for(let x=0;x<S.N;x++){
      const i=idx(x,y);
      if(src[i+3]!==0) continue;
      const nb = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for(const [nx,ny] of nb){
        if(inB(nx,ny) && src[idx(nx,ny)+3]>0){
          const c = colorAtY(y);
          arr[i]=c[0];arr[i+1]=c[1];arr[i+2]=c[2];arr[i+3]=255;
          break;
        }
      }
    }
  }
}

/* ============ pattern brushes ============ */
function fractalAt(cx,cy){
  const r = S.size;
  const verts = [[cx, cy-r], [cx-r, cy+r], [cx+r, cy+r]];
  let px = cx, py = cy;
  const n = Math.min(9000, (2*r+1)*(2*r+1)*3);
  for(let i=0;i<n;i++){
    const v = verts[ri(0,2)];
    px = (px + v[0]) / 2;
    py = (py + v[1]) / 2;
    const x = Math.round(px), y = Math.round(py);
    if(i>10 && inB(x,y)) stamp(x, y, paintColor());
  }
}
function treeAt(cx,cy){
  const r = S.size;
  const maxDepth = Math.min(9, 4 + Math.floor(r/6));
  function branch(x,y,ang,len,depth){
    if(depth<=0 || len<0.8) return;
    const nx = x + Math.cos(ang)*len;
    const ny = y - Math.sin(ang)*len;
    line(Math.round(x),Math.round(y),Math.round(nx),Math.round(ny),(lx,ly)=>{
      if(inB(lx,ly)) stamp(lx,ly,paintColor());
    });
    const spread = rnd(0.32, 0.6);
    branch(nx,ny, ang+spread+rnd(-0.1,0.1), len*rnd(0.62,0.75), depth-1);
    branch(nx,ny, ang-spread+rnd(-0.1,0.1), len*rnd(0.62,0.75), depth-1);
    if(Math.random()<0.25) branch(nx,ny, ang+rnd(-0.15,0.15), len*0.7, depth-1);
  }
  branch(cx, cy+r, Math.PI/2, r*0.7, maxDepth);
}
function circleOutline(cx,cy,r,fn){
  const steps = Math.max(16, Math.ceil(2*Math.PI*r*1.6));
  for(let i=0;i<steps;i++){
    const a = (i/steps)*Math.PI*2;
    fn(Math.round(cx+Math.cos(a)*r), Math.round(cy+Math.sin(a)*r));
  }
}
function lifeAt(cx,cy){
  const R = Math.max(2,S.size), r = R/2;
  const put = (x,y)=>{ if(inB(x,y)) stamp(x,y,paintColor()); };
  circleOutline(cx,cy,r,put);
  for(let k=0;k<6;k++){
    const a = k*Math.PI/3;
    circleOutline(cx+Math.cos(a)*r, cy+Math.sin(a)*r, r, put);
  }
  circleOutline(cx,cy,R,put);
}
function spiralAt(cx,cy){
  const R = Math.max(2, S.size);
  const turns = 3;
  const steps = Math.max(80, R*40);
  for(let i=0;i<=steps;i++){
    const t = (i/steps)*turns*Math.PI*2;
    const rr = (i/steps)*R;
    const x = Math.round(cx + Math.cos(t)*rr);
    const y = Math.round(cy + Math.sin(t)*rr);
    if(inB(x,y)) stamp(x, y, paintColor());
  }
}

/* ============ undo ============ */
function cloneLayers(){
  return layers.map(l => ({name:l.name, visible:l.visible, pix:l.pix.slice()}));
}
function snapshot(){
  undoStack.push({layers: cloneLayers(), active, counter: layerCounter});
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack = [];
}
function restore(state){
  layers = state.layers.map(l => ({name:l.name, visible:l.visible, pix:l.pix.slice()}));
  active = Math.min(state.active, layers.length-1);
  layerCounter = state.counter;
  renderLayerList(); render();
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push({layers: cloneLayers(), active, counter: layerCounter});
  restore(undoStack.pop());
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push({layers: cloneLayers(), active, counter: layerCounter});
  restore(redoStack.pop());
}

/* ============ input ============ */
function cellFromEvent(e){
  const r = ui.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX - r.left) / r.width  * S.N),
    y: Math.floor((e.clientY - r.top)  / r.height * S.N),
  };
}
let effectRAF = null;
let gdBase = null, gdStart = null, gdHue = 0;
const BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function bayerAt(x,y){ return BAYER4[((y%4)+4)%4][((x%4)+4)%4]; }
function radialDither(arr, sx, sy, R){
  const y0=Math.max(0,Math.floor(sy-R)), y1=Math.min(S.N-1,Math.ceil(sy+R));
  const x0=Math.max(0,Math.floor(sx-R)), x1=Math.min(S.N-1,Math.ceil(sx+R));
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const d = 1 - Math.hypot(x-sx,y-sy)/R;
      if(d<=0) continue;
      if(d*16 > bayerAt(x,y)) setPx(arr,x,y,colorAtY(y));
    }
  }
}
function linearDither(arr, sx, sy, ex, ey){
  const vx=ex-sx, vy=ey-sy;
  const len2 = vx*vx + vy*vy;
  if(len2 < 1) return;
  for(let y=0;y<S.N;y++){
    for(let x=0;x<S.N;x++){
      const t = ((x-sx)*vx + (y-sy)*vy) / len2;
      if(t<0 || t>1) continue;
      const d = 1 - t;
      if(d*16 > bayerAt(x,y)) setPx(arr,x,y,colorAtY(y));
    }
  }
}
function buildShapeMask(kind, w, hh){
  const m = new Uint8Array(w*hh);
  if(kind==='square' || kind==='rect'){ m.fill(1); return m; }
  const cx=(w-1)/2, cy=(hh-1)/2;
  const rx=Math.max(0.5,(w-1)/2), ry=Math.max(0.5,(hh-1)/2);
  if(kind==='circle'){
    for(let y=0;y<hh;y++) for(let x=0;x<w;x++){
      const nx=(x-cx)/rx, ny=(y-cy)/ry;
      if(nx*nx+ny*ny <= 1.04) m[y*w+x]=1;
    }
    return m;
  }
  if(kind==='triangle'){
    for(let y=0;y<hh;y++) for(let x=0;x<w;x++){
      if(Math.abs(x-cx) <= (y/Math.max(1,hh-1))*rx + 0.25) m[y*w+x]=1;
    }
    return m;
  }
  if(kind==='diamond'){
    for(let y=0;y<hh;y++) for(let x=0;x<w;x++){
      if(Math.abs(x-cx)/rx + Math.abs(y-cy)/ry <= 1.04) m[y*w+x]=1;
    }
    return m;
  }
  const bmp = BMP[kind];
  if(!bmp){ m.fill(1); return m; }
  const bh=bmp.length, bw=bmp[0].length;
  const scale=Math.min(w/bw, hh/bh);
  const dw=Math.max(1,Math.round(bw*scale)), dh=Math.max(1,Math.round(bh*scale));
  const ox=Math.floor((w-dw)/2), oy=Math.floor((hh-dh)/2);
  for(let py=0;py<dh;py++){
    const sy=Math.min(bh-1,Math.floor(py/scale));
    for(let px=0;px<dw;px++){
      const sx=Math.min(bw-1,Math.floor(px/scale));
      if(bmp[sy][sx]==='#') m[(oy+py)*w + (ox+px)] = 1;
    }
  }
  return m;
}
function paintMask(mask, w, hh, ax, ay, useOutline){
  for(let y=0;y<hh;y++){
    for(let x=0;x<w;x++){
      if(!mask[y*w+x]) continue;
      if(useOutline){
        let edge=false;
        for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){
          if(nx<0||ny<0||nx>=w||ny>=hh||!mask[ny*w+nx]){ edge=true; break; }
        }
        if(!edge) continue;
      }
      const gx=ax+x, gy=ay+y;
      if(inB(gx,gy)) stamp(gx, gy, colorAtY(gy));
    }
  }
}
function placeShape(sx,sy,ex,ey){
  if(S.shape==='line'){
    line(sx,sy,ex,ey,(x,y)=>{ if(inB(x,y)) stamp(x,y,colorAtY(y)); });
    return;
  }
  let x1=ex, y1=ey;
  if(S.shape==='square'){
    const s = Math.max(Math.abs(ex-sx), Math.abs(ey-sy));
    x1 = sx + (ex>=sx?1:-1)*s;
    y1 = sy + (ey>=sy?1:-1)*s;
  }
  const ax=Math.min(sx,x1), bx=Math.max(sx,x1), ay=Math.min(sy,y1), by=Math.max(sy,y1);
  const w=bx-ax+1, hh=by-ay+1;
  paintMask(buildShapeMask(S.shape, w, hh), w, hh, ax, ay, S.fillOutline);
}
function stampClickAt(cx,cy){
  const t = 2*S.size + 1;
  paintMask(buildShapeMask(S.stampShape, t, t), t, t, cx-S.size, cy-S.size, S.fillOutline);
}
function gditherApply(sx,sy,ex,ey){
  const arr = A();
  const starts = mirrorPoints(sx,sy), ends = mirrorPoints(ex,ey);
  for(let k=0;k<starts.length;k++){
    const [ax,ay]=starts[k], [bx,by]=ends[k];
    if(S.ditherMode==='radial') radialDither(arr, ax, ay, Math.max(1, Math.hypot(bx-ax, by-ay)));
    else linearDither(arr, ax, ay, bx, by);
  }
}
function effectLoop(){
  if(!S.drawing){ effectRAF=null; return; }
  const {x,y} = S.cell;
  if(inB(x,y)){
    if(S.tool==='swirl') swirlAt(x,y);
    else if(S.tool==='distort') distortAt(x,y);
    else if(S.tool==='melt') meltAt(x,y);
    else if(S.tool==='wave') waveAt(x,y);
    else if(S.tool==='spray') sprayAt(x,y);
    render();
  }
  effectRAF = requestAnimationFrame(effectLoop);
}

ui.addEventListener('contextmenu', e => e.preventDefault());
ui.addEventListener('pointerdown', e => {
  e.preventDefault();
  if(typeof closeMobilePanels === 'function' && closeMobilePanels()) return;
  ui.setPointerCapture(e.pointerId);
  const c = cellFromEvent(e);
  S.cell = c; S.lastCell = c;

  if(e.button === 2){
    snapshot();
    S.drawing = true; S.erasing = true;
    stamp(c.x, c.y, [0,0,0,0]);
    render();
    return;
  }

  if(S.tool==='picker'){
    if(inB(c.x,c.y)){
      const i = idx(c.x,c.y);
      if(comp[i+3]>0){
        S.color = rgbToHex(comp[i],comp[i+1],comp[i+2]);
        document.getElementById('color').value = S.color;
      }
    }
    setTool('pencil');
    return;
  }

  snapshot();
  S.drawing = true;

  if(S.tool==='pencil'){ stamp(c.x,c.y,paintColor()); render(); }
  else if(S.tool==='eraser'){ stamp(c.x,c.y,[0,0,0,0]); render(); }
  else if(S.tool==='dither'){ ditherAt(c.x,c.y); render(); }
  else if(S.tool==='sort'){ sortAt(c.x,c.y); render(); }
  else if(['gdither','shape'].includes(S.tool)){
    gdBase = A().slice(); gdStart = {x:c.x, y:c.y}; gdHue = S.hueCursor;
  }
  else if(S.tool==='bucket'){
    for(const [mx,my] of mirrorPoints(c.x,c.y)){
      flood(mx,my, (fx,fy) => colorAtY(fy));
    }
    S.drawing = false; render();
  }
  else if(S.tool==='fractal'){ fractalAt(c.x,c.y); S.drawing=false; render(); }
  else if(S.tool==='tree'){ treeAt(c.x,c.y); S.drawing=false; render(); }
  else if(S.tool==='life'){ lifeAt(c.x,c.y); S.drawing=false; render(); }
  else if(S.tool==='spiral'){ spiralAt(c.x,c.y); S.drawing=false; render(); }
  else if(S.tool==='stampc'){ stampClickAt(c.x,c.y); S.drawing=false; render(); }
  else if(['spray','swirl','distort','melt','wave'].includes(S.tool)){
    if(!effectRAF) effectRAF = requestAnimationFrame(effectLoop);
  }
});
ui.addEventListener('pointermove', e => {
  const c = cellFromEvent(e);
  const moved = c.x!==S.cell.x || c.y!==S.cell.y;
  S.cell = c;
  if(S.drawing && moved){
    if(S.erasing){
      line(S.lastCell.x,S.lastCell.y,c.x,c.y,(x,y)=>stamp(x,y,[0,0,0,0]));
      render();
    } else if(S.tool==='pencil'){
      line(S.lastCell.x,S.lastCell.y,c.x,c.y,(x,y)=>stamp(x,y,paintColor()));
      render();
    } else if(S.tool==='eraser'){
      line(S.lastCell.x,S.lastCell.y,c.x,c.y,(x,y)=>stamp(x,y,[0,0,0,0]));
      render();
    } else if(S.tool==='dither'){
      ditherAt(c.x,c.y); render();
    } else if(S.tool==='sort'){
      sortAt(c.x,c.y); render();
    } else if(gdBase && ['gdither','shape'].includes(S.tool)){
      A().set(gdBase);
      S.hueCursor = gdHue;
      if(S.tool==='gdither') gditherApply(gdStart.x, gdStart.y, c.x, c.y);
      else placeShape(gdStart.x, gdStart.y, c.x, c.y);
      render();
    }
    S.lastCell = c;
  }
  drawOverlay();
});
function stopDraw(){ S.drawing = false; S.erasing = false; S.lastCell = null; gdBase = null; gdStart = null; }

              '#00ccff','#0066ff','#7b2fff','#bf00ff','#ff66cc','#00ffff','#f4ff47','#ff3399'];
const NEON_RGB = NEON.map(hexToRgb);
const BASICS = ['#ffffff','#d9d9d9','#a3a3a3','#5c5c5c','#2b2b2b','#000000','#8b5a2b','#f0c8a0'];
const PICO8 = ['#000000','#1d2b53','#7e2553','#008751','#ab5236','#5f574f','#c2c3c7','#fff1e8',
               '#ff004d','#ffa300','#ffec27','#00e436','#29adff','#83769c','#ff77a8','#ffccaa'];
const EARTH = ['#3b2f2f','#5d4037','#795548','#8d6e63','#a1887f','#b08d57','#c2b280','#d2b48c',
               '#556b2f','#6b8e23','#8f9779','#4e342e','#7c5c45','#9c7a5b','#deb887','#e6ddc4'];
const PALETTE_KINDS = [
  ['default','Psychedelic'],
  ['basics','Basic Colors'],
  ['neonfull','Psychedelic Full'],
  ['primary','Primary Tones'],
  ['secondary','Secondary Tones'],
  ['complementary','Complementary'],
  ['opposite','Opposite'],

  ['cool','Cool Palette'],
  ['pastel','Pastel'],
  ['earth','Earth'],
  ['gray','Grayscale'],
  ['pico8','PICO-8'],
];

function rampOf(hues, sat, lums){
  const out=[];
  for(const h of hues) for(const l of lums) out.push(hsl(h, sat, l));
  return out;
}
function buildPalette(kind){
  const baseHsl = () => {
    const [r,g,b]=hexToRgb(S.color);
    return rgbToHsl(r,g,b);
  };
  switch(kind){
    case 'primary':   return rampOf([0,60,240], 1, [.2,.35,.5,.65,.8]).concat(['#ffffff']);
    case 'secondary': return rampOf([30,120,270], 1, [.2,.35,.5,.65,.8]).concat(['#ffffff']);
    case 'complementary': {
      const [h,s] = baseHsl();
      const sat = Math.max(s, .6);
      return rampOf([h], sat, [.15,.27,.39,.51,.63,.75,.87,.95])
        .concat(rampOf([h+180], sat, [.15,.27,.39,.51,.63,.75,.87,.95]));
    }
    case 'opposite': {
      const [h,s] = baseHsl();
      const sat = Math.max(s, .6);
      const base = rampOf([h], sat, [.2,.35,.5,.65,.8,.9]);
      const opp = base.map(x => {
        const [r,g,b]=hexToRgb(x);
        return rgbToHex(255-r,255-g,255-b);
      });
      return base.concat(opp).concat(['#000000','#ffffff','#808080','#c0c0c0']);
    }
    case 'warm': return rampOf([0,16,32,48,58], .95, [.32,.52,.72]).concat(['#8b5a2b']);
    case 'cool': return rampOf([150,185,215,245,275], .85, [.32,.52,.72]).concat(['#cfe8ff']);
    case 'pastel': {
      const out=[];
      for(let h=0; h<360; h+=30) out.push(hsl(h,.75,.8));
      out.push(hsl(0,.5,.9), hsl(90,.5,.9), hsl(180,.5,.9), hsl(270,.5,.9));
      return out;
    }
    case 'earth': return EARTH.slice();
    case 'gray': {
      const out=[];
      for(let i=0;i<16;i++){ const v=Math.round(i/15*255); out.push(rgbToHex(v,v,v)); }
      return out;
    }
    case 'pico8': return PICO8.slice();
    case 'basics': return BASICS.slice();
    case 'neonfull': return NEON.slice();
    default: return NEON.slice(0,8);
  }
}

/* ============ remix engine ============ */
function eachPx(arr, fn){
  for(let i=0;i<arr.length;i+=4){
    if(arr[i+3]===0) continue;
    fn(i);
  }
}
const OPS = [
  function opHueShift(arr){
    const shift = rnd(40, 320);
    eachPx(arr, i => {
      const [h,s,l] = rgbToHsl(arr[i],arr[i+1],arr[i+2]);
      const [r,g,b] = hslToRgb(h+shift, Math.max(s,0.4), l);
      arr[i]=r; arr[i+1]=g; arr[i+2]=b;
    });
  },
  function opInvert(arr){
    eachPx(arr, i => { arr[i]=255-arr[i]; arr[i+1]=255-arr[i+1]; arr[i+2]=255-arr[i+2]; });
  },
  function opChannelSwap(arr){
    const perms = [[1,2,0],[2,0,1],[0,2,1],[2,1,0],[1,0,2]];
    const p = perms[ri(0,perms.length-1)];
    eachPx(arr, i => {
      const v=[arr[i],arr[i+1],arr[i+2]];
      arr[i]=v[p[0]]; arr[i+1]=v[p[1]]; arr[i+2]=v[p[2]];
    });
  },
  function opFlip(arr, N){
    const horiz = Math.random()<0.5;
    const src = arr.slice();
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const si = ((horiz? y : N-1-y)*N + (horiz? N-1-x : x))*4;
      const di = (y*N+x)*4;
      for(let k=0;k<4;k++) arr[di+k]=src[si+k];
    }
  },
  function opRotate90(arr, N){
    const src = arr.slice();
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const si = ((N-1-x)*N + y)*4;
      const di = (y*N+x)*4;
      for(let k=0;k<4;k++) arr[di+k]=src[si+k];
    }
  },
  function opShiftWrap(arr, N){
    const dx = ri(1,N-1), dy = ri(0,N-1);
    const src = arr.slice();
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const si = (((y+dy)%N)*N + ((x+dx)%N))*4;
      const di = (y*N+x)*4;
      for(let k=0;k<4;k++) arr[di+k]=src[si+k];
    }
  },
  function opKaleido(arr, N){
    const src = arr.slice();
    const h = Math.floor(N/2);
    for(let y=0;y<N;y++) for(let x=h;x<N;x++){
      const si = (y*N + (N-1-x))*4, di=(y*N+x)*4;
      for(let k=0;k<4;k++) arr[di+k]=src[si+k];
    }
    const src2 = arr.slice();
    for(let y=h;y<N;y++) for(let x=0;x<N;x++){
      const si = ((N-1-y)*N + x)*4, di=(y*N+x)*4;
      for(let k=0;k<4;k++) arr[di+k]=src2[si+k];
    }
  },
  function opSwirls(arr, N){
    const n = ri(1,3);
    for(let i=0;i<n;i++)
      swirlArr(arr, N, ri(0,N-1), ri(0,N-1), ri(Math.floor(N/4), Math.floor(N/1.6)), rnd(-1.6,1.6));
  },
  function opDistortPass(arr, N){
    distortArr(arr, N, Math.floor(N/2), Math.floor(N/2), N, ri(1,3), rnd(0.15,0.4));
  },
  function opNeonPosterize(arr){
    eachPx(arr, i => {
      let best=0, bd=Infinity;
      for(let k=0;k<NEON_RGB.length;k++){
        const c=NEON_RGB[k];
        const d=(arr[i]-c[0])**2 + (arr[i+1]-c[1])**2 + (arr[i+2]-c[2])**2;
        if(d<bd){bd=d;best=k;}
      }
      const c=NEON_RGB[best];
      arr[i]=c[0]; arr[i+1]=c[1]; arr[i+2]=c[2];
    });
  },
  function opRowRainbow(arr, N){
    const off = rnd(0,360), dir = Math.random()<0.5;
    for(let y=0;y<N;y++){
      const shift = off + ((dir? y : N-1-y)/N)*360;
      for(let x=0;x<N;x++){
        const i=(y*N+x)*4;
        if(arr[i+3]===0) continue;
        const [h,s,l]=rgbToHsl(arr[i],arr[i+1],arr[i+2]);
        const [r,g,b]=hslToRgb(h+shift, Math.max(s,0.45), l);
        arr[i]=r; arr[i+1]=g; arr[i+2]=b;
      }
    }
  },
  function opGradientMap(arr){
    eachPx(arr, i => {
      const l = (arr[i]*0.299 + arr[i+1]*0.587 + arr[i+2]*0.114) / 255;
      const c = gradSample(l);
      arr[i]=c[0]; arr[i+1]=c[1]; arr[i+2]=c[2];
    });
  },
  function opMeltPass(arr, N){
    const passes = ri(2, Math.max(3, Math.floor(N/4)));
    for(let p=0;p<passes;p++)
      meltArr(arr, N, Math.floor(N/2), Math.floor(N/2), N, 7);
  },
  function opSortRows(arr, N){
    for(let y=0;y<N;y++){
      if(Math.random()<0.5) continue;
      sortArr(arr, N, Math.floor(N/2), y, 0);
    }
  },
];

let remixes = [];
function makeRemixes(){
  const count = parseInt(document.getElementById('remixCount').value,10);
  composite();
  remixes = [];
  for(let i=0;i<count;i++){
    const arr = comp.slice();
    const nOps = ri(2,4);
    const pool = OPS.slice();
    for(let k=0;k<nOps;k++){
      const op = pool.splice(ri(0,pool.length-1),1)[0];
      op(arr, S.N);
    }
    remixes.push(arr);
  }
  const grid = document.getElementById('remixGrid');

function downloadArr(arr, tag){
  const scale = parseInt(document.getElementById('exportScale').value,10);
  const tmp = document.createElement('canvas');
  tmp.width = S.N; tmp.height = S.N;
  tmp.getContext('2d').putImageData(new ImageData(arr.slice(), S.N, S.N), 0, 0);
  const out = document.createElement('canvas');
  out.width = S.N*scale; out.height = S.N*scale;
  const octx = out.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.drawImage(tmp, 0, 0, out.width, out.height);
  const a = document.createElement('a');

  a.href = out.toDataURL('image/png');
  a.click();
}

/* ============ projects: save gallery + autosave ============ */
function layerToPng(l, n){
  const t = document.createElement('canvas');
  t.width = n; t.height = n;
  t.getContext('2d').putImageData(new ImageData(l.pix.slice(), n, n), 0, 0);
  return t.toDataURL('image/png');
}
function serializeProject(){
  return {
    N: S.N,
    layers: layers.map(l => ({name:l.name, visible:l.visible, png:layerToPng(l, S.N)})),
    updated: Date.now(),
  };
}
function applyProject(pr, cb){
  ensureSizeOption(pr.N);
  initCanvas(pr.N);
  const Ls = new Array(pr.layers.length);
  let pending = pr.layers.length;
  if(!pending){ if(cb) cb(); return; }
  pr.layers.forEach((ld, i) => {
    const img = new Image();
    img.onload = () => {
      const t = document.createElement('canvas');
      t.width = pr.N; t.height = pr.N;
      const tc = t.getContext('2d');
      tc.imageSmoothingEnabled = false;
      tc.drawImage(img, 0, 0);
      const data = tc.getImageData(0, 0, pr.N, pr.N).data;
      const pix = new Uint8ClampedArray(pr.N*pr.N*4);
      pix.set(data);
      Ls[i] = {name: ld.name, visible: ld.visible !== false, pix};
      if(--pending === 0){
        layers = Ls;
        active = 0;
        layerCounter = Ls.length;
        renderLayerList(); render();
        if(cb) cb();
      }
    };
    img.src = ld.png;
  });
}
let autosaveT = null;
function scheduleAutosave(){
  if(autosaveT) clearTimeout(autosaveT);
  autosaveT = setTimeout(() => { store.set('pf_autosave', serializeProject()); }, 1200);
}

    row.className = 'row';
    const load = document.createElement('button');
    load.className = 'act'; load.textContent = 'Open';
    load.addEventListener('click', () => {
      applyProject(pr);
      document.getElementById('galleryModal').classList.remove('open');
    });
    const del = document.createElement('button');
    del.className = 'act warn'; del.textContent = 'Delete';
    del.addEventListener('click', () => {
      if(!confirm('Delete project "' + pr.name + '"?')) return;
      const arr = getProjects();
      arr.splice(i, 1);
      store.set('pf_projects', arr);
      renderGallery();
    });
    row.appendChild(load); row.appendChild(del);
    cell.appendChild(nameEl); cell.appendChild(cv); cell.appendChild(row);
    grid.appendChild(cell);
  });
}
document.getElementById('galleryBtn').addEventListener('click', () => {
  renderGallery();
  document.getElementById('galleryModal').classList.add('open');
});
document.getElementById('galleryModal').addEventListener('click', e => {
  if(e.target.id === 'galleryModal') e.target.classList.remove('open');
});
window.addEventListener('keydown', e => {
  if(e.key === 'Escape')
    document.querySelectorAll('#galleryModal, #paletteModal, #remixModal, #sizeModal')
      .forEach(m => m.classList.remove('open'));
});
document.getElementById('projSaveBtn').addEventListener('click', () => {
  const name = prompt('Name this project:');
  if(!name) return;
  const arr = getProjects();
  arr.push(Object.assign({id: Date.now(), name}, serializeProject()));
  store.set('pf_projects', arr);
  if(!storagePersists()) alert('Heads up: browser storage is unavailable here, so this save lasts only for this session.');
  renderGallery();
});
document.getElementById('projNewBtn').addEventListener('click', () => {
  if(!confirm('Start a new blank project? (Current drawing stays available via autosave until you draw again.)')) return;
  initCanvas(S.N);
  document.getElementById('galleryModal').classList.remove('open');
});

/* ============ mobile layout: brush + color live in the sticky strip ============ */
(function(){
  const sideEl = document.getElementById('side');
  const sBrush = document.getElementById('s-brush');
  const sColor = document.getElementById('s-color');
  const sExport = document.getElementById('s-export');
  const mq = window.matchMedia('(max-width:760px)');
  function relayout(){
    if(mq.matches){
      document.getElementById('mtopRow').insertBefore(sBrush, document.getElementById('mtopBtns'));
      document.getElementById('mtopColor').appendChild(sColor);
    } else {
      sideEl.insertBefore(sColor, sExport);
      sideEl.insertBefore(sBrush, sColor);
    }
  }
  if(mq.addEventListener) mq.addEventListener('change', relayout);
  relayout();
})();

/* ============ mobile icon bar ============ */
function closeMobilePanels(){
  const open = document.querySelectorAll('.mopen');
  const hadOpen = open.length > 0;
  open.forEach(x => x.classList.remove('mopen'));
  document.querySelectorAll('#mbar .mbtn, #bbar .mbtn').forEach(x => x.classList.remove('active'));
  return hadOpen;
}
document.querySelectorAll('#mbar [data-panel], #bbar [data-panel]').forEach(btn => {
  btn.addEventListener('click', () => {
    const el = document.getElementById(btn.dataset.panel);
    const wasOpen = el.classList.contains('mopen');
    closeMobilePanels();
    if(!wasOpen){
      el.classList.add('mopen');
      btn.classList.add('active');
    }
  });
});
document.getElementById('mUndo').addEventListener('click', () => { closeMobilePanels(); undo(); });
document.getElementById('mRedo').addEventListener('click', () => { closeMobilePanels(); redo(); });

/* ============ UI wiring ============ */
function setTool(t){
  S.tool = t;
  document.querySelectorAll('.tbtn[data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === t));
  drawOverlay();
}
document.querySelectorAll('.tbtn[data-tool]').forEach(b =>
  b.addEventListener('click', () => setTool(b.dataset.tool)));

function refreshColorAux(){
  const m = S.colorMode;
  document.getElementById('palette').style.display = (m==='solid') ? 'grid' : 'none';
  document.getElementById('hueBar').style.display = (m==='hue') ? 'block' : 'none';
  const pm = document.getElementById('palManage');
  if(pm) pm.style.display = (m==='solid' && currentPalette==='custom') ? 'grid' : 'none';
}
function setColorMode(m){
  S.colorMode = m;
  document.querySelectorAll('[data-cmode]').forEach(b =>
    b.classList.toggle('on', b.dataset.cmode === m));
  document.getElementById('cycleRow').style.display = (m==='solid') ? 'none' : 'flex';

document.querySelectorAll('[data-cmode]').forEach(b =>
  b.addEventListener('click', () => {

document.getElementById('shapeSelect').addEventListener('change', e => {

  setTool('shape');
});
document.getElementById('stampSelect').addEventListener('change', e => {
  S.stampShape = e.target.value;
  setTool('stampc');
});
function syncFillButtons(){
  const solidBtn = document.querySelector('[data-cmode="solid"]');
  const outBtn = document.getElementById('outlineToggle');
  outBtn.classList.toggle('on', S.fillOutline);
  if(S.fillOutline) solidBtn.classList.remove('on');
  else solidBtn.classList.toggle('on', S.colorMode === 'solid');
}
document.getElementById('outlineToggle').addEventListener('click', () => {
  S.fillOutline = !S.fillOutline;
  syncFillButtons();
});
document.querySelectorAll('[data-dmode]').forEach(b =>
  b.addEventListener('click', () => {
    S.ditherMode = b.dataset.dmode;
    document.querySelectorAll('[data-dmode]').forEach(x =>
      x.classList.toggle('on', x.dataset.dmode === S.ditherMode));
    setTool('gdither');
  }));

const SIZE_PRESETS = [4,8,16,32,64,128,256,512,1024];
const SIZE_HUES = ['#FF00FF','#BF5CFF','#7F7FFF','#4D8CFF','#00D5FF','#00FFA0','#9BFF00','#FFD500','#FF3B3B'];
let extraSizes = [];
function ensureSizeOption(n){
  if(!SIZE_PRESETS.includes(n) && !extraSizes.includes(n)) extraSizes.push(n);
  const btn = document.getElementById('gridSize');
  if(btn) btn.textContent = n + ' × ' + n;
}
function applySize(n){
  n = Math.max(4, Math.min(1024, n|0));
  if(!n) return;
  const dirty = layers.some(l => l.pix.some(px=>px!==0));
  if(n !== S.N && dirty && !confirm('Changing canvas size clears all layers. Continue?')) return;
  if(n >= 512 && n !== S.N &&
     !confirm(n + '×' + n + ' is a big canvas — brushes stay fine, but full-canvas effects will be slow on a phone. Continue?')) return;
  ensureSizeOption(n);
  initCanvas(n);
  document.getElementById('sizeModal').classList.remove('open');
}
function renderSizeList(){
  const list = document.getElementById('sizeList');
  list.innerHTML = '';
  const all = SIZE_PRESETS.concat(extraSizes.filter(x => !SIZE_PRESETS.includes(x))).sort((a,b)=>a-b);
  all.forEach((n, i) => {
    const card = document.createElement('div');
    card.className = 'sizeCard' + (n===S.N ? ' sel' : '');
    card.style.setProperty('--pc', SIZE_HUES[i % SIZE_HUES.length]);
    const box = document.createElement('div');
    box.className = 'sizeChipBox';
    const chip = document.createElement('div');
    chip.className = 'sizeChip';
    const side = Math.round(16 + (i/(all.length-1 || 1))*30);   // grows with resolution
    const cells = Math.min(n, 8);                                // visible grid density
    chip.style.width = side + 'px';
    chip.style.height = side + 'px';
    chip.style.backgroundSize = (side/cells) + 'px ' + (side/cells) + 'px';
    box.appendChild(chip);
    const lab = document.createElement('div');
    lab.className = 'slabel';
    lab.textContent = n + '×' + n;
    card.appendChild(box); card.appendChild(lab);
    card.addEventListener('click', () => applySize(n));
    list.appendChild(card);
  });
}
document.getElementById('gridSize').addEventListener('click', () => {
  renderSizeList();
  document.getElementById('sizeModal').classList.add('open');
});
document.getElementById('sizeCustomGo').addEventListener('click', () => {
  const v = parseInt(document.getElementById('sizeCustom').value, 10);
  if(v) applySize(v);
});
document.getElementById('sizeCustom').addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const v = parseInt(e.target.value, 10);
    if(v) applySize(v);
  }
});
document.getElementById('sizeModal').addEventListener('click', e => {
  if(e.target.id === 'sizeModal') e.target.classList.remove('open');
});
document.getElementById('tileSize').addEventListener('change', e => {
  S.tileN = parseInt(e.target.value,10);
  tile.width = S.N*S.tileN; tile.height = S.N*S.tileN;
  render();
});
document.getElementById('gridToggle').addEventListener('click', e => {
  S.showGrid = !S.showGrid;

});
document.getElementById('color').addEventListener('input', e => { S.color = e.target.value; });
document.getElementById('hueStep').addEventListener('input', e => {

  document.getElementById('hueStepVal').textContent = S.hueStep;
});
document.getElementById('mirX').addEventListener('click', e => {
  S.mirrorX = !S.mirrorX; e.target.classList.toggle('on', S.mirrorX); drawOverlay();
});
document.getElementById('mirY').addEventListener('click', e => {
  S.mirrorY = !S.mirrorY; e.target.classList.toggle('on', S.mirrorY); drawOverlay();
});
document.getElementById('brushSize').addEventListener('input', e => {

});
document.getElementById('power').addEventListener('input', e => {

});

document.getElementById('addLayer').addEventListener('click', () => addLayer());
document.getElementById('dupLayer').addEventListener('click', duplicateLayer);
document.getElementById('delLayer').addEventListener('click', removeActiveLayer);
document.getElementById('layerUp').addEventListener('click', () => moveLayer(1));
document.getElementById('layerDown').addEventListener('click', () => moveLayer(-1));

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);
document.getElementById('exportBtn').addEventListener('click', () => {
  composite();
  downloadArr(comp, 'art');
});
document.getElementById('exportLayersBtn').addEventListener('click', () => {
  layers.forEach((l, i) => {
    const tag = 'layer' + (i+1) + '_' + l.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase();
    setTimeout(() => downloadArr(l.pix, tag), i*400);
  });
});
document.getElementById('remixBtn').addEventListener('click', makeRemixes);
document.getElementById('remixAgain').addEventListener('click', makeRemixes);
document.getElementById('remixClose').addEventListener('click', () =>
  document.getElementById('remixModal').classList.remove('open'));
document.getElementById('remixModal').addEventListener('click', e => {
  if(e.target.id === 'remixModal') e.target.classList.remove('open');
});


/* keyboard */
window.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey) && k==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  const map = {b:'pencil', s:'spray', e:'eraser', g:'bucket', i:'picker',
               w:'swirl', d:'distort', t:'dither', n:'melt', x:'sort', v:'wave',
               f:'fractal', r:'tree', l:'life', p:'spiral', q:'gdither', m:'stampc'};
  if(map[k]) setTool(map[k]);
  const shapeKeys = {k:'line', c:'circle', o:'square', h:'rect'};
  if(shapeKeys[k]){
    S.shape = shapeKeys[k];
    document.getElementById('shapeSelect').value = S.shape;
    setTool('shape');
  }
  if(k==='['){ S.size=Math.max(1,S.size-1); syncBrushUI(); }
  if(k===']'){ S.size=Math.min(S.N,S.size+1); syncBrushUI(); }
});
function syncBrushUI(){
  document.getElementById('brushSize').value = S.size;
  document.getElementById('brushSizeVal').textContent = S.size;
  drawOverlay();
}

/* ============ boot ============ */
new ResizeObserver(fitOverlay).observe(wrap);
initCanvas(128);
ensureSizeOption(128);
const _auto = store.get('pf_autosave');
if(_auto && _auto.N && Array.isArray(_auto.layers) && _auto.layers.length){
  applyProject(_auto);
}
rebuildPalSelect();
rebuildGradSelect();
renderGradUI();
renderPalette('default');
setColorMode('solid');
fitOverlay();
})();
